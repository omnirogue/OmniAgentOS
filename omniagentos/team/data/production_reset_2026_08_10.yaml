  - ref: hooli-revenue
    title: "Hooli takes money"
    horizon: long_term
    company: hooli
    owner: emp_alice
    description: >
      Hooli is live and brand-complete but cannot take a single payment — every pricing button
      loops back to the sign-up page. This is Hooli's own top-level revenue objective; it does not
      ladder through N1-N5 (those are the platform's cross-portfolio conditions), it sits beside
      them the way each product's own destination does.

  - ref: cluster-shared-queue
    title: "Shared queue live on 3 machines"
    horizon: short_term
    parent: ns-n1
    company: omniagentos
    owner: emp_alice
    description: >

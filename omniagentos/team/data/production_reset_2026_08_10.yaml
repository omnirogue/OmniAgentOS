      tunnel rather than building a new system.

  - ref: cluster-enterprise-automation
    title: "Enterprise automation first path"
    horizon: short_term
    parent: ns-n3
    company: initech
    owner: emp_alice
    description: >
      Smallest shippable increment toward N3: a database migration plus one automated welcome

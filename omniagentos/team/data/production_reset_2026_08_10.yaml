# Example seed data — Team Work OS initial population (migration 123).
# ALL content below is a FICTIONAL startup-portfolio example.
#
# This is a weekly work-queue snapshot for the OmniAgentOS platform team and the small portfolio
# of startups it operates across: Initech (an enterprise CRM), Globex (an ads platform), AcmeUni
# (an online course business) and Hooli (a consumer app). It models a fictional operator's weekly
# plan, the platform's long-term destination conditions, and the shared-queue scheduling conflict
# between Alice and Bob's two specs for the same week.
#
# Consumed by scripts/import-reset-queue.py, which is IDEMPOTENT against this file: re-running
# it never duplicates a goal (matched on company+title) or a task (matched on ref).
#
# Schema (informal, see tests/team_import/test_yaml_valid.py for the enforced contract):
#
#   companies: [{slug, name}]
#       The six EXISTING org_companies rows this file's goals/tasks may reference. The importer
#       never creates a company — an unknown slug here is a bug in this file, not new data.
#
#   goals: [{ref, title, horizon, company, owner, parent(optional), description}]
#       `ref` is a LOCAL key for this file (not a board ref) used only to resolve `parent` and
#       tasks' `goal_ref`. `horizon` is long_term|short_term; short_term goals carry `parent`
#       (another goal's ref) so the ladder from work to why is unbroken. Idempotency key is
#       (company, title) — never (ref) — because the ref is a fixture of THIS FILE, not of the
#       company_goals table.
#
#   tasks: [{ref, title, owner, size, priority, status, blocked_reason, goal_ref, due_date,
#             owned_paths, depends_on, acceptance_criteria, description,
#             parent_task_ref(optional), source, baseline_evidence(optional)}]
#       `ref` IS the board_tasks.ref — the idempotency key. `parent_task_ref` names another
#       task's `ref`; the importer creates every task with no `parent_task_ref` first (this
#       includes every UP-*/SP-*/OPSP-* parent and every standalone card), then resolves and
#       creates the children — the schema's hierarchy is exactly one level deep, so two passes
#       are sufficient. Scoring counts ONLY top-level (parentless) tasks, which is why every
#       parent's `size` is the one that matters for the weekly number; subtask sizes are the
#       per-person estimate, not a scoring input, once they are nested.
#
#       `owned_paths` has no dedicated column on board_tasks (migration 123 did not add one). The
#       importer stores its JSON array under `org_json.owned_paths` for machine attribution and
#       mirrors it into `description` as a trailing "Owned paths:" line for humans.
#
#       `baseline_evidence` (baseline rows only): {ref, title} for the one evidence row the
#       importer attaches (kind=doc, attribution=manual) before self-verifying as emp_owner.


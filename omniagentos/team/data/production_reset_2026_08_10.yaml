      the telemetry build (S1, WP-1..4) and the platform's own health/janitor signals both serve.

  - ref: ns-n5
    title: "Every human hour goes to design, review, or judgment — never to production typing"
    horizon: long_term
    company: omniagentos
    owner: emp_owner
    description: >
      North Star condition N5. Today mostly typing. The Team Work OS itself (this queue) is the
      mechanism this condition is measured through.

  - ref: cluster-green-main
    title: "Green main & zero PR backlog"
    horizon: short_term
    parent: ns-n1
    company: omniagentos
    owner: emp_alice
    description: >
      Every open PR on the platform repo is blocked by the same red main, not by many separate
      defects. U1 unblocks the pipeline; U2 lands the fix; S2 drains the backlog; S5-S8 give the

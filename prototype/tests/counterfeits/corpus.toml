#  The counterfeit corpus.
#
#  Each entry removes ONE safety or learning property by a single literal
#  find/replace and names the tests that must go red when it does. An entry that
#  survives is not a broken test — it is a property nothing in this suite
#  defends, and the fix is a test, not a smaller corpus.
#
#  Fields
#  ------
#  id                a stable slug; it is what a failure report names
#  family            "safety" or "learning"
#  primary_template  the template this attacks, or "" for a cross-cutting rule
#  file              path relative to the project root
#  find / replace    the mutation. `find` must match EXACTLY ONCE or the corpus
#                    hard-fails as STALE — a refactor that moves a guard must
#                    break the entry watching it, loudly
#  rationale         what the removed line is for, printed when it survives
#  must_fail         pytest node ids, run unmutated in the control pass and
#                    mutated in the entry's own run
#  failure_re        regex the mutated output must match, so a red run for an
#                    unrelated reason is not counted as a catch
#  undefended_by     set ONLY when nothing in the suite defends the property.
#                    Names the test that is owed. The entry is marked
#                    xfail(strict=True), so writing that test turns the XFAIL
#                    into an XPASS and forces this field's removal.
#
#  Why the learning entries are half the corpus: the system this package was
#  extracted from ran 87 mutation patches and NONE of them touched learning
#  code, which is exactly the part that starved undetected — 207 candidates
#  staged, zero ever promoted, for months. Coverage of the learning loop is the
#  one thing in here that is not cuttable.


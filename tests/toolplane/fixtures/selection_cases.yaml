# Tool-selection cases for the Phase-2 WP0 retrieval benchmark.
#
# Each case: a natural-language need, the one tool that answers it, and the ids the caller
# is not allowed to see. Scored by tests/toolplane/test_selection_fixtures.py as top-5 hit
# rate against catalog_100 / catalog_250 / catalog_500.
#
#   kind: plain         a straightforward request; baseline recall
#   kind: adversarial   the catalog holds a genuine near-twin of the answer (named in note)
#   kind: invisibility  the obvious top hit is in hidden_ids and must never surface at any
#                       rank; expected_tool_id is the best visible alternative
#
# Queries are written the way a user asks -- task-framed, not a restatement of the tool's
# own description. They keep one or two lexical anchors on purpose: the retriever is BM25,
# so a query sharing no vocabulary with any tool is unanswerable by construction and would
# measure nothing.
version: 1
cases:
- id: sel_001
  catalog: catalog_100
  query: react with a thumbs up emoji to a teammate's post
  expected_tool_id: slack.add_reaction
  hidden_ids: []
  kind: plain
  note: direct lexical match on reaction and emoji

# Synthetic tool catalog for the tool-selection benchmark (Phase-2 WP0).
#
# Standalone fixture shape -- NOT a file the production loader reads. Each record
# carries exactly the identity/metadata fields that
# omniagentos.toolplane.catalog.CatalogEntry indexes for search:
#   id, namespace, label, compact_hint, description, parameter_names,
#   input_examples, risk, read_only
# tests/toolplane/test_selection_fixtures.py maps them onto real CatalogEntry
# objects and runs omniagentos.toolplane.search over them.
#
# Ordering: namespaces interleaved across four product domains, each namespace's
# tools kept together in id order. catalog_100 is a strict prefix of catalog_250,
# which is a strict prefix of catalog_500, so the same query can be scored against
# a growing catalog.
version: 1
name: catalog_100
tools:

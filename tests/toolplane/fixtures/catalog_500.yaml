  label: Get Card Transaction
  compact_hint: View single credit card charge.
  description: Retrieves merchant, status, and policy match details of card charge matching ID.
  parameter_names:
  - transaction_id
  - expand_metadata
  input_examples:
  - get credit card charge details for card_tx_55
  risk: low
  read_only: true
- id: brex.get_cash_transaction
  namespace: brex
  label: Get Cash Transaction
  compact_hint: View single cash transaction.
  description: Retrieves structural transfer and routing metadata of cash transaction matching ID.
  parameter_names:
  - transaction_id
  - expand_metadata
  input_examples:
  - get cash transaction details for tx_32
  risk: low
  read_only: true
- id: brex.list_card_transactions
  namespace: brex
  label: List Card Transactions
  compact_hint: Retrieve company card charges.
  description: Retrieves credit card transaction history across all corporate card users.
  parameter_names:
  - user_ids
  - status
  - limit
  input_examples:
  - list corporate credit card transactions
  risk: low
  read_only: true
- id: brex.list_cash_transactions
  namespace: brex
  label: List Cash Transactions
  compact_hint: Retrieve corporate cash transactions.
  description: Retrieves bank transaction list for primary company cash bank accounts.
  parameter_names:
  - account_id
  - cursor
  - limit
  input_examples:
  - list company cash account transactions
  risk: low
  read_only: true
- id: brex.list_users
  namespace: brex
  label: List Users
  compact_hint: List company employees on Brex.
  description: Returns list of company employees holding active or invited card profiles.
  parameter_names:
  - limit
  - cursor
  input_examples:
  - show employees on brex platform
  risk: low
  read_only: true
- id: brex.suspend_card
  namespace: brex
  label: Suspend Card
  compact_hint: Temporarily lock credit card.
  description: Locks an active card to block any new payment authorizations temporarily.
  parameter_names:
  - card_id
  - reason
  input_examples:
  - lock credit card card_887
  risk: high
  read_only: false
- id: brex.terminate_card
  namespace: brex
  label: Terminate Card
  compact_hint: Permanently close credit card.
  description: Closes a credit card account permanently to block future transactions.
  parameter_names:
  - card_id
  - reason
  input_examples:
  - terminate credit card card_887
  risk: high
  read_only: false
- id: zoom.add_meeting_registrant
  namespace: zoom
  label: Add Meeting Registrant
  compact_hint: Register participant for a meeting.
  description: Registers an individual attendee for a scheduled meeting, returning customized join links.
  parameter_names:
  - meeting_id
  - email_address
  - first_name
  - last_name
  input_examples:
  - register attendee to zoom meeting
  risk: medium
  read_only: false
- id: zoom.create_meeting
  namespace: zoom
  label: Create Meeting
  compact_hint: Schedule a new meeting.
  description: Schedules a standard Zoom meeting with designated audio, security, and scheduling options.
  parameter_names:
  - topic
  - start_time
  - duration_minutes
  - passcode
  input_examples:
  - schedule a meeting for team sync
  risk: medium
  read_only: false
- id: zoom.create_webinar
  namespace: zoom
  label: Create Webinar
  compact_hint: Schedule a new webinar.
  description: Schedules a Zoom webinar with designated panelist, registration, and QA options.
  parameter_names:
  - topic
  - start_time
  - duration_minutes
  - invite_panelists
  input_examples:
  - schedule a new webinar for next week
  risk: medium
  read_only: false
- id: zoom.delete_meeting
  namespace: zoom
  label: Delete Meeting
  compact_hint: Cancel and delete a meeting.
  description: Permanently cancels and deletes an upcoming meeting, invalidating its join URLs.
  parameter_names:
  - meeting_id
  - send_cancellation_email
  input_examples:
  - cancel the scheduled zoom meeting
  risk: high
  read_only: false
- id: zoom.delete_recording
  namespace: zoom
  label: Delete Recording
  compact_hint: Delete cloud recording file.
  description: Permanently deletes a specified cloud recording file or meeting recording folder.
  parameter_names:
  - meeting_id
  - recording_file_id
  input_examples:
  - delete video recording file
  risk: high
  read_only: false
- id: zoom.get_meeting
  namespace: zoom
  label: Get Meeting
  compact_hint: Get meeting details and join URL.
  description: Retrieves complete schedule metadata and participation URLs for a single meeting ID.
  parameter_names:
  - meeting_id
  input_examples:
  - retrieve link and code for zoom meeting
  risk: low
  read_only: true
- id: zoom.list_meetings
  namespace: zoom
  label: List Meetings
  compact_hint: List meetings scheduled by user.
  description: Retrieves a listing of all upcoming or previous meetings scheduled by the authenticated user.
  parameter_names:
  - limit
  - page_number
  - meeting_type
  input_examples:
  - list my scheduled zoom meetings
  risk: low
  read_only: true
- id: zoom.list_recordings
  namespace: zoom
  label: List Recordings
  compact_hint: List cloud recording files.
  description: Retrieves a list of saved cloud recording video, audio, and chat files for a specific meeting.
  parameter_names:
  - meeting_id
  input_examples:
  - list cloud recordings for meeting
  risk: low
  read_only: true
- id: zoom.search_meetings
  namespace: zoom
  label: Search Meetings
  compact_hint: Find scheduled meetings by query.
  description: Queries and searches through the user meeting list matching topic or keyword filters.
  parameter_names:
  - query_string
  - limit
  input_examples:
  - find zoom meetings about budget review
  risk: low
  read_only: true
- id: zoom.update_meeting
  namespace: zoom
  label: Update Meeting
  compact_hint: Change scheduled meeting settings.
  description: Modifies parameters, times, passwords, or host configurations of a scheduled meeting.
  parameter_names:
  - meeting_id
  - topic
  - start_time
  - duration_minutes
  input_examples:
  - reschedule my zoom meeting
  risk: medium
  read_only: false

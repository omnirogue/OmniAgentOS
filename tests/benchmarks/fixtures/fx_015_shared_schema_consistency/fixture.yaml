prompt: |
  You are tasked with extending a schema-based record processing system to Version 2 and making its core modules fully generic. Currently, in Version 1, the schema definition is hardcoded in `schema.py` and the three consumer modules (`writer.py`, `reader.py`, `validator.py`) also hardcode Version 1 fields (`id` and `name`).

  ### Tasks

  1. **Extend schema.py to VERSION 2**
     Update `schema.py` so that `VERSION = 2`.
     Append exactly two new fields to `FIELDS` in this order:
     - `Field(name="active", kind="bool", required=True)`
     - `Field(name="note", kind="str", required=False)`
     
  2. **Make the Consumers Schema-Driven**
     Rewrite the three consumers (`writer.py`, `reader.py`, `validator.py`) so that their behavior is derived dynamically from `schema.FIELDS` at call time. No consumer module may hardcode the list of schema fields. If `schema.FIELDS` is modified dynamically (e.g. by appending a new field at runtime), all consumers must immediately honor the change.

  ### Consumer Requirements

  - **writer.py — `def encode(record: dict[str, object]) -> str`**
    Renders a record as `key=value` pairs joined by `|`, in the exact order of `schema.FIELDS`.
    - Check the record against `validator.validate(record)`. If there are any validation problems, raise a `ValueError`.
    - For string fields, escape any occurrences of `|` (as `\|`) and `\` (as `\\`).
    - Render booleans as `true` or `false`.
    - If an optional/non-required field is missing from `record`, fill it with its default value per kind (`int` -> `0`, `str` -> `""`, `bool` -> `False`).
    - Always emit every field defined in `schema.FIELDS`, including optional ones.

  - **reader.py — `def decode(line: str) -> dict[str, object]`**
    Parses a serialized string and returns a dictionary.
    - Must raise `reader.DecodeError` (a subclass of `ValueError`, defined in `reader.py`) on any parsing or validation failure (e.g., unknown keys, missing required keys, or values that cannot coerce to their declared type).
    - Coerce raw string values to their declared schema types (`int`, `bool`, or `str`). Unescape any backslash-escaped `|` (from `\|`) and `\` (from `\\`) in string values.
    - **Backwards Compatibility / Defaults on Decode**:
      - If a field is missing from the input line:
        - If the field is `active`, fill it with `False` (this is the only back-compat exception for required fields).
        - Otherwise, if the field is required, raise `DecodeError`.
        - If the field is optional/non-required, fill it with the kind's default value (`int` -> `0`, `str` -> `""`, `bool` -> `False`).

  - **validator.py — `def validate(record: dict[str, object]) -> list[str]`**
    Analyzes a dictionary `record` against `schema.FIELDS` and returns a sorted list of human-readable problem strings. Returns an empty list `[]` if the record is completely valid.
    - Report one problem string per missing required field, e.g., containing `"missing required field"` and the field name.
    - Report one problem string per unknown key, e.g., containing `"unknown field"` and the key name.
    - Report one problem string per wrong Python type, e.g., containing `"invalid type"` and the field name. (Strict Python type checks: `"int"` expects a real Python `int` but not a `bool`; `"bool"` expects a real Python `bool`; `"str"` expects a real Python `str`).

  ### Constraints and Scope

  Modify only `schema.py`, `writer.py`, `reader.py` and `validator.py`. Do not modify `check_roundtrip.py` or anything under `records/`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

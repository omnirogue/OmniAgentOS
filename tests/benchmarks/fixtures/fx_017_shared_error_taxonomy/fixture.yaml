prompt: |
  You are tasked with refactoring an error handling system to use a single shared error taxonomy instead of scattered, hardcoded exception-matching lists.

  Currently, the workspace contains a seed registry in `errors.py` which defines two error codes (`E_NOT_FOUND` and `E_INTERNAL`), and three different surfaces (`api.py`, `worker.py`, and `cli.py`) that implement hardcoded `isinstance` checks and hardcoded literals to classify domain exceptions (`NotFound` and `Internal`).

  Your goal is to transition the system to a clean, centralized design where all error behaviors are derived dynamically from a shared `errors.REGISTRY` map.

  ### Requirements:

  1. **Extend the Registry in `errors.py`:**
     Expand the shared `errors.REGISTRY` to include all of the following five error specifications:
     - `E_NOT_FOUND`: HTTP status 404, not retryable (`False`), exit code 4.
     - `E_CONFLICT`: HTTP status 409, not retryable (`False`), exit code 5.
     - `E_RATE_LIMITED`: HTTP status 429, retryable (`True`), exit code 6.
     - `E_TIMEOUT`: HTTP status 504, retryable (`True`), exit code 7.
     - `E_INTERNAL`: HTTP status 500, retryable (`True`), exit code 1.

  2. **Add Domain Exception Classes in `errors.py`:**
     Define the following exception classes: `NotFound`, `Conflict`, `RateLimited`, `Timeout`, and `Internal`. All must subclass a common `AppError` base class (which itself subclasses Python's standard `Exception`).
     Give `AppError` a `code` class attribute so that each exception class or instance can cleanly map to its corresponding registry code string without any per-surface `isinstance` ladder. Ensure each specific exception class overrides this attribute with its correct code.

  3. **Refactor the Three Surfaces:**
     Eliminate all hardcoded literals (HTTP status codes, retryable booleans, and exit codes) and any `isinstance` chains over specific exception subclasses from the following surfaces:
     - `api.py`:
       - `to_response(exc: Exception) -> dict[str, object]`: Returns a dictionary of the form `{"code": str, "status": int, "retryable": bool}`.
     - `worker.py`:
       - `should_retry(exc: Exception) -> bool`: Returns whether the exception's code spec specifies it as retryable.
       - `dead_letter_reason(exc: Exception) -> str`: Returns a string of the format `"{code}: {message}"` where `{message}` is the string representation of the exception.
     - `cli.py`:
       - `exit_code_for(exc: Exception) -> int`: Returns the integer exit code from the code spec.
       - `render(exc: Exception) -> str`: Returns a string of the format `"error [{code}]: {message}"` where `{message}` is the string representation of the exception.

  4. **Exception Mapping Rules:**
     - If an exception inherits from `errors.AppError`, determine its error code from its `code` attribute, then look up the spec in `errors.REGISTRY` at runtime.
     - If an exception is not an instance of `errors.AppError` (e.g. a standard Python `ValueError` or `RuntimeError`), it must be treated as `E_INTERNAL` by all three surfaces.

  5. **Runtime Derivation Requirement:**
     Do not hardcode or cache the error mappings. At runtime, the surfaces must dynamically read the values from `errors.REGISTRY` and look up the spec via `errors.spec_for(code)`. A new `AppError` subclass with a new code registered dynamically into `errors.REGISTRY` during execution must be immediately honored by all three surfaces without any code changes to the surfaces.

  6. **Helper Functions in `errors.py`:**
     - `spec_for(code: str) -> ErrorSpec` must raise `KeyError` if the code is unknown.
     - `all_codes() -> tuple[str, ...]` must return a sorted tuple of all code strings currently in the registry.

  Modify only `errors.py`, `api.py`, `worker.py` and `cli.py`. Do not modify `check_errors.py` or anything under `docs/`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

prompt: |
  You are tasked with updating command metadata across our command modules, rebuilding the command index, and modernizing the dispatch router.

  Currently, there are 12 command modules located under `commands/`:
  - `build.py`
  - `clean.py`
  - `deploy.py`
  - `doctor.py`
  - `fetch.py`
  - `init.py`
  - `lint.py`
  - `migrate.py`
  - `publish.py`
  - `rollback.py`
  - `status.py`
  - `verify.py`

  The task must be executed strictly according to the details below.

  ### 1. Update Command Modules (commands/*.py)
  In each of the twelve modules listed above, add a module-level `META: dict[str, object]` constant.
  - The dictionary must have exactly these keys: `name`, `summary`, `danger`, `aliases`.
  - `name` is the module's own file name without the `.py` suffix (e.g. `"build"`).
  - The other keys must come from that command's row in the table below:
    * `danger` is a boolean (`true` or `false`).
    * `aliases` is a TUPLE of strings (even if there is only one alias, e.g. `("cl",)` for clean). If a command has multiple aliases, they must be in the exact order shown.
  - Do not modify or remove the existing `run` function in each module.

  | command  | summary                                | danger | aliases    |
  |----------|----------------------------------------|--------|------------|
  | build    | Compile the project artifacts.         | false  | b, make    |
  | clean    | Remove build output and caches.        | true   | cl         |
  | deploy   | Ship the current build to an environment. | true | dep, ship  |
  | doctor   | Diagnose the local environment.        | false  | doc, dr    |
  | fetch    | Download remote dependencies.          | false  | f, pull    |
  | init     | Create a new project skeleton.         | false  | new        |
  | lint     | Check the source for style problems.   | false  | l          |
  | migrate  | Apply pending database migrations.     | true   | mig, mg    |
  | publish  | Upload a release to the registry.      | true   | pub        |
  | rollback | Revert the last deployment.            | true   | rb, undo   |
  | status   | Show the current project state.        | false  | st, info   |
  | verify   | Run the acceptance checks.             | false  | v, check   |

  Every alias must be unique across all twelve commands.

  ### 2. Rewrite the Index (index.py)
  Rewrite `index.py` to:
  - Dynamically/programmatically build `COMMANDS: tuple[dict[str, object], ...]` by importing all twelve modules from an explicit tuple of module names (no dynamic directory scanning using os.walk or similar; use the explicit module-name tuple).
  - Collect their `META` dictionary and ensure the `COMMANDS` tuple is sorted alphabetically by the `name` key of each dict.
  - Implement `find(token: str) -> dict[str, object]`:
    * This function must resolve a command name OR any of its aliases.
    * It must raise `UnknownCommand` (defined in `index.py`, subclassing Python's built-in `KeyError`) if the command or alias cannot be found.
  - Implement `help_text() -> str`:
    * This function returns one line per command, sorted by name.
    * Format: `"<name>  <summary>"` (with the name left-padded to the width of the longest name, plus two spaces before the summary, and a trailing `" [danger]"` on any command where `danger` is `True`).
    * No trailing newline in the final return string.

  ### 3. Rewrite the Router (router.py)
  Rewrite `router.py` to:
  - Define `dispatch(argv: list[str]) -> int`.
  - It must resolve `argv[0]` through `index.find`.
  - If the command is resolved, invoke that command module's `run(argv[1:])` and return its exit code.
  - If `argv` is empty or if the command is unknown, return `2`.

  Modify only the twelve command modules listed above, `index.py` and `router.py`. Everything under `commands/vendor/` and every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

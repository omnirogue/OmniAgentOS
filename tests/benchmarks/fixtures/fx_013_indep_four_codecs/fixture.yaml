prompt: |
  Your task is to implement four independent codec modules inside the `codec/` package.
  These four tasks are completely independent of one another, do not share constraints, and can be completed in any order or even in parallel if you have a way to do so.

  CRITICAL: You are FORBIDDEN from using `base64`, `binascii`, or any other third-party or stdlib codec shortcut. Every codec must be implemented from scratch using basic arithmetic, bitwise operations, and indexing. Only Python 3.12 standard library features (like string and list manipulation) are permitted.

  ### Deliverable 1: Run-Length Encoding (RLE) (`codec/rle.py`)
  Implement the following in `codec/rle.py`:
  * `class CodecError(ValueError):`
    An exception class defined in the module that subclasses Python's standard `ValueError`.
  * `def rle_encode(data: str) -> str`
    Encodes a string using run-length encoding.
    - Runs of 2 or more identical characters become `<count><char>` (e.g., `"aa"` encodes as `"2a"`).
    - A run of exactly 1 identical character is emitted as the bare character itself (e.g., `"a"` encodes as `"a"`).
    - Runs longer than 9 must be split into chunks of at most 9 (e.g., 12 `"a"`s encode as `"9a3a"`).
    - If `data` contains any digit characters, raise `CodecError` (because digits would be ambiguous on decode).
    - An empty input `""` should return `""`.
  * `def rle_decode(text: str) -> str`
    Decodes an RLE-encoded string, acting as the exact inverse of `rle_encode`.
    - If the input is malformed, raise `CodecError`. Malformation conditions include:
      - A count digit with no following character (e.g., `"9"` or `"a9"`).
      - An input or part of input containing consecutive digits / a digit run of more than one digit (e.g., `"12a"` or `"a23b"`).
      - Invalid/unsupported count values like `0` or `1` (since run lengths of 1 or less are not represented as counts in this format).
    - `rle_decode(rle_encode(s)) == s` must hold for every digit-free string, including `""`.

  ### Deliverable 2: Unsigned LEB128 Varint (`codec/varint.py`)
  Implement the following in `codec/varint.py`:
  * `class CodecError(ValueError):`
    An exception class defined in the module that subclasses Python's standard `ValueError`.
  * `def encode_varint(value: int) -> bytes`
    Encodes a non-negative integer using unsigned LEB128 varint encoding:
    - 7 bits per byte, little-endian, with the high bit (MSB, `0x80`) set on every byte except the final byte.
    - `0` encodes as `b"\x00"`.
    - If `value` is negative, raise `CodecError`.
  * `def decode_varint(buf: bytes, offset: int = 0) -> tuple[int, int]`
    Decodes a single varint from `buf` starting at `offset`.
    - Returns a tuple `(value, next_offset)`.
    - If `offset` is out of bounds (negative or `>= len(buf)`), raise `CodecError`.
    - If the buffer ends before the varint terminates (the terminal byte with high bit unset is never found), raise `CodecError`.
  * `def encode_all(values: list[int]) -> bytes`
    Encodes a list of non-negative integers by concatenating their varint encodings.
    - If any value is negative, raise `CodecError`.
  * `def decode_all(buf: bytes) -> list[int]`
    Decodes all varints from `buf` and returns them as a list of integers.
    - An empty buffer `b""` returns `[]`.
    - If there is trailing garbage or an incomplete varint at the end, raise `CodecError`.

  ### Deliverable 3: RFC 4648 Base32 (`codec/base32.py`)
  Implement the following in `codec/base32.py` (the variable `ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"` is already declared in the module stub):
  * `class CodecError(ValueError):`
    An exception class defined in the module that subclasses Python's standard `ValueError`.
  * `def b32_encode(data: bytes) -> str`
    Encodes `data` into an RFC 4648 Base32 string.
    - Uses upper-case alphabet and pad character `=` to ensure the output length is a multiple of 8.
  * `def b32_decode(text: str) -> bytes`
    Decodes an RFC 4648 Base32 string back into bytes.
    - Accepts upper-case characters only (raises `CodecError` if lower-case letters are present).
    - Requires correct padding length and structure (must be a multiple of 8 characters, and padding `=` characters must only appear at the end).
    - Raises `CodecError` on a bad character, an invalid string length, or non-zero leftover bits (the unused padding bits at the end of the final encoded character block must be 0).
    - Known vectors to support:
      - `b""` -> `""`
      - `b"f"` -> `"MY======"`
      - `b"fo"` -> `"MZXQ===="`
      - `b"foo"` -> `"MZXW6==="`
      - `b"foob"` -> `"MZXW6YQ="`
      - `b"fooba"` -> `"MZXW6YTB"`
      - `b"foobar"` -> `"MZXW6YTBOI======"`

  ### Deliverable 4: Canonical Hexdump (`codec/hexdump.py`)
  Implement the following in `codec/hexdump.py`:
  * `def hexdump(data: bytes, width: int = 16) -> str`
    Generates a canonical `hexdump -C` style string of `data` using lines of `width` bytes.
    - `width` must be between 1 and 32 inclusive, otherwise raise `ValueError` (standard Python `ValueError`).
    - If `data` is empty, return `""` (with no newlines).
    - The returned string must NOT have a trailing newline at the very end of the output.
    - Each line represents `width` bytes and must be structured as follows:
      - An 8-digit lowercase hex offset representing the starting index of the line (e.g. `00000000`), followed by exactly two spaces.
      - A hex bytes representation section: lowercase, two digits per byte, space-separated.
      - If `width` is even, there must be an EXTRA space (so two spaces total) in the middle of the hex bytes representation section (specifically after the byte at index `(width // 2) - 1`). For example, for `width = 8`, the extra space is after the 4th byte representation.
      - If the final line has fewer than `width` bytes, the hex representation section must still be padded with spaces so that the ASCII gutter is perfectly aligned with the previous lines. Specifically, the hex-field column width is `width * 3` columns when `width` is even because of the midpoint double space, and `width * 3 - 1` columns when `width` is odd.
      - Exactly two spaces separating the hex section from the ASCII gutter.
      - The ASCII gutter wrapped in `|` characters, where printable ASCII characters (`0x20` to `0x7E` inclusive) are rendered as-is, and any other bytes are rendered as `.`.
    - Worked example:
      The exact returned string for `hexdump(b"hello world", width=8)` must be:
      ```
      00000000  68 65 6c 6c  6f 20 77 6f  |hello wo|
      00000008  72 6c 64                  |rld|
      ```
      (Verify that the hex representation of Line 2 is padded so that `|rld|` aligns perfectly with `|hello wo|` of Line 1, meaning the start of the ASCII gutter is at the exact same column index).

  ### Constraints & Scope
  Modify only `codec/rle.py`, `codec/varint.py`, `codec/base32.py` and `codec/hexdump.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

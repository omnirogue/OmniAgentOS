prompt: |
  Implement a three-stage strictly-sequential template engine in Python 3.12 (standard library only) consisting of lexical scanning, structural tree parsing, and rendering under a given context.

  The application is structured into four sequential modules:

  1. tmpl_scan.py:
     - Defines Node dataclass:
       @dataclass(frozen=True)
       class Node:
           kind: str      # "text" | "var" | "if" | "else" | "end"
           value: str     # the literal text, or the variable/condition name
     - Defines TemplateError (subclasses ValueError).
     - Implement `scan(template: str) -> list[Node]`.
       - Variable tags: `{{ name }}` -> a `var` node with value `name` (surrounding spaces stripped).
       - Control tags: `{% if name %}` -> an `if` node with value `name`; `{% else %}` -> an `else` node with value `""`; `{% end %}` -> an `end` node with value `""`.
       - All tags support optional surrounding ASCII spaces and tabs within the tag characters, which are stripped.
       - A valid name is a non-empty string consisting entirely of alphanumeric characters and underscores `[A-Za-z0-9_]`.
       - Anything else inside a tag (unmatched characters, empty tag contents, or unknown control keyword) or an unterminated tag must raise a TemplateError.
       - The exception message of TemplateError must contain the 0-based index where the offending tag started (the opening `{{` or `{%`).
       - Any character that is not part of a tag is parsed as literal text. Consecutive literal characters must be grouped into a single `text` node. Adjacent tags must not produce empty text nodes.
       - A literal `{` not followed immediately by `{` or `%` is treated as ordinary text.

  2. tmpl_parse.py:
     - Defines Block dataclass:
       @dataclass(frozen=True)
       class Block:
           kind: str                  # "root" | "text" | "var" | "if"
           value: str
           body: tuple[Block, ...]      # for "if": the true branch; else empty
           orelse: tuple[Block, ...]    # for "if": the false branch; else empty
     - Defines ParseError (subclasses ValueError).
     - Implement `build_tree(nodes: list[Node]) -> Block`.
       - Returns a `root` Block whose body is the top-level sequence of blocks.
       - The `if`, `else`, and `end` nodes determine the control flow nesting. Nested blocks are collected recursively or via a stack.
       - An `else` with no open `if`, an `end` with no open `if`, an `if` left unclosed at the end of the input, or an `if` containing multiple `else` blocks must raise a ParseError.
       - Leaf blocks (`text` and `var`) carry their respective values, with both body and orelse set to empty tuples.

  3. tmpl_render.py:
     - Defines RenderError (subclasses KeyError).
     - Implement `render(tree: Block, context: dict[str, object]) -> str`.
       - Recursively renders the parsed block tree:
         - `text` blocks are rendered literally.
         - `var` blocks evaluate to `str(context[name])`. If `name` is missing from the context, raise a RenderError whose message contains the missing name.
         - `if` blocks evaluate their condition using `bool(context.get(name, False))`. If the condition evaluates to True, its `body` blocks are rendered; otherwise, its `orelse` blocks are rendered. Note that a missing condition name in an `if` block must NOT raise an error; it simply evaluates to False. This contrast is a key detail.
         - `root` blocks render their body blocks sequentially.

  4. engine.py:
     - Implement `render_template(template: str, context: dict[str, object]) -> str` which runs the entire pipeline (scan -> build_tree -> render).
     - Implement `safe_render(template: str, context: dict[str, object]) -> str` which runs the pipeline but catches any of TemplateError, ParseError, or RenderError and returns the string format `<error: {message}>` where `{message}` is the caught exception's own message. Every exception raised by the engine must be initialized with a single human-readable message string, which must contain the index (for TemplateError) or the variable name (for RenderError).

  Modify only `tmpl_scan.py`, `tmpl_parse.py`, `tmpl_render.py` and `engine.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

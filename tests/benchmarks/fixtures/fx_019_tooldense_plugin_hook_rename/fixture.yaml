  The task must be executed strictly as follows:

  1. **Update Plugins:**
     In every one of the 12 plugin modules listed above:
     - Rename the hook function from `on_event` to `handle_event` (preserving its signature `def handle_event(payload: dict[str, str]) -> str` and internal behavior).
     - Add a module-level string constant `PLUGIN_ID: str` whose value is the module's own file name without the `.py` extension (e.g. `PLUGIN_ID = "archive"` in `archive.py`).

  2. **Update the Loader (`loader.py`):**
     - Modify `load_plugins()` to look for `PLUGIN_ID` and `handle_event` (instead of using the module filename as the ID and looking for `on_event`).
     - If either `PLUGIN_ID` or `handle_event` is missing in a plugin module, raise a `PluginError` (defined in `loader.py` subclassing `RuntimeError`) naming the offending module.
     - Modify `dispatch(name, payload)` so that it routes the event to the correct plugin handler and raises `KeyError` for an unknown plugin ID.

  3. **Update the Manifest (`manifest.py`):**
     - Regenerate the `MANIFEST` tuple so that it lists all 12 `(plugin_id, priority)` pairs matching the plugin modules exactly.
     - The tuple must be sorted in descending order of `priority` (and if any priorities are equal, then alphabetically by `plugin_id`).
     - Update `manifest_ids()` to return a tuple of only the plugin IDs in that exact sorted order.

  Modify only the twelve modules listed above, `loader.py` and `manifest.py`. Everything under `plugins/vendor/` and every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

prompt: |
  You are tasked with renaming the event hook function and adding a unique identifier constant across our event plugins, and then updating the plugin loader and manifest accordingly.

  Currently, there are 12 plugin modules located under `plugins/`:
  - `archive.py`
  - `audit.py`
  - `backup.py`
  - `cache.py`
  - `digest.py`
  - `export.py`
  - `ingest.py`
  - `notify.py`

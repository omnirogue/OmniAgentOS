prompt: |
  Implement three independent utility formatters inside the `fmt/` package. These deliverables are completely decoupled and may be implemented in any order.

  ### Deliverable 1: Duration Formatter and Parser (`fmt/duration.py`)

  Implement the following functions in `fmt/duration.py`:

  ```python
  def format_duration(seconds: int) -> str:
      ...

  def parse_duration(text: str) -> int:
      ...
  ```

  - `format_duration` takes a non-negative integer of seconds and formats it as a string representing duration. The output must render the largest non-zero units, in the order of days (`d`), hours (`h`), minutes (`m`), and seconds (`s`), joined by single spaces.
    - Examples:
      - `90061` -> `"1d 1h 1m 1s"`
      - `3600` -> `"1h"`
      - `0` -> `"0s"`
      - `61` -> `"1m 1s"`
      - `3601` -> `"1h 1s"`
    - Units with a zero count are omitted entirely (unless the input is exactly `0`, which renders as `"0s"`).
    - A negative input must raise a `ValueError`.

  - `parse_duration` is the exact inverse for the strings `format_duration` produces, and must also accept the units in any order, with or without spaces.
    - Examples:
      - `"1d 1h 1m 1s"` -> `90061`
      - `"1m30s"` -> `90`
      - `"30s 1m"` -> `90`
      - `"0s"` -> `0`
    - Round-tripping must hold for every non-negative input: `parse_duration(format_duration(s)) == s`.
    - If the string is empty, contains an unknown unit, has a missing number, has a missing unit, or has a repeated unit, it must raise a `ValueError`.
    - Invalid whitespace or extra characters outside components must also raise `ValueError`.

  ### Deliverable 2: Table Renderer (`fmt/table.py`)

  Implement the following function in `fmt/table.py`:

  ```python
  def render_table(headers: list[str], rows: list[list[str]], align: str = "") -> str:
      ...
  ```

  - Renders a fixed-width text table where column width is the longest cell in that column (including the header cell). Cells are padded with ASCII spaces and joined by `" | "`. Trailing spaces at the end of any rendered line must be stripped (there are no trailing spaces at the end of a line).
  - A separator line of `-` characters must sit between the header row and the body rows. The separator line must be exactly as wide as the longest rendered line in the entire table (including the header line).
  - `align` is an optional string of `'l'`/`'r'` characters, one per column.
    - `'l'` indicates left alignment (padded on the right with spaces).
    - `'r'` indicates right alignment (padded on the left with spaces).
    - If `align` is empty (`""`), it defaults to all `'l'`.
    - If the length of `align` does not match the header count, or if it contains any character other than `'l'` or `'r'`, raise `ValueError`.
  - If any row in `rows` does not have a length matching the header count, raise `ValueError`.
  - If `rows` is empty, render just the header row and the separator line.
  - The returned string must NOT have a trailing newline character.

  ### Deliverable 3: Custom CSV Serializer (`fmt/csvout.py`)

  Implement RFC-4180 style CSV formatting by hand. **Do NOT use the built-in Python `csv` module** (it is forbidden for this task).

  Implement the following functions in `fmt/csvout.py`:

  ```python
  def quote_field(value: str) -> str:
      ...

  def to_csv(rows: list[list[str]]) -> str:
      ...
  ```

  - `quote_field` wraps the value in double quotes and doubles every embedded double quote (`"`) IF AND ONLY IF the value contains any of the following characters:
    - a comma (`,`)
    - a double quote (`"`)
    - a carriage return (`\r`)
    - a line feed (`\n`)
    - OR if the value has leading or trailing ASCII spaces (literal space character `' '`).
    - Otherwise, the value must be returned unchanged.

  - `to_csv` serializes a grid of strings to CSV format:
    - It must call `quote_field` on every individual cell in each row.
    - Fields within a row must be joined by commas (`,`).
    - Rows must be joined by `\r\n`, and there must be a trailing `\r\n` after the final row.
    - An empty row list (`[]`) must return `""`.
    - A row containing zero fields (an empty list `[]` as a row) must render as an empty line (which means a line with just `\r\n`).

  ### Constraints and Scope

  - Python 3.12, STDLIB ONLY. No third-party imports are permitted.
  - Do not use the `csv` module.
  - Modify only `fmt/duration.py`, `fmt/table.py` and `fmt/csvout.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

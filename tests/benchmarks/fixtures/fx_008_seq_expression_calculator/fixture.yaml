prompt: |
  Implement a four-stage pipeline sequence expression calculator in Python 3.12 (standard library only).
  The application is structured into four sequential modules:

  1. lexer.py:
     - Defines Token dataclass:
       @dataclass(frozen=True)
       class Token:
           kind: str        # "number" | "op" | "lparen" | "rparen"
           text: str
     - Defines LexError (subclasses ValueError).
     - Implement `tokenize(source: str) -> list[Token]`.
       - Numbers: one or more digits, optionally followed by '.' and one or more digits. Literal formats such as '1.' and '.5' are invalid and must raise LexError.
       - Operators: '+', '-', '*', '/', '%', '^'.
       - Parentheses produce 'lparen' or 'rparen' tokens with text '(' or ')'.
       - ASCII spaces and tabs separate tokens and are otherwise ignored.
       - Any other character raises LexError whose message contains the 0-based index of the offending character.

  2. rpn.py:
     - Defines ParseError (subclasses ValueError).
     - Implement `to_rpn(tokens: list[Token]) -> list[Token]`.
       - Uses Shunting-yard algorithm to convert infix tokens to RPN.
       - Precedence: '^' is 3, '*', '/' and '%' are 2, '+' and '-' are 1.
       - '^' is right-associative; all other operators are left-associative.
       - Unbalanced parentheses must raise ParseError.
       - Unary minus/plus (e.g. '-3' or '+3') is invalid and must raise ParseError.
       - Detect structurally if an operator lacks a left or right operand, or if two numbers are adjacent. (Hint: track whether the previous token was a value or can close/open a value, or keep track of value expectation).
       - Empty token list must return an empty list [].

  3. evaluate.py:
     - Defines EvalError (subclasses ValueError).
     - Implement `eval_rpn(output: list[Token]) -> float`.
       - Every arithmetic result is a float.
       - '/' and '%' by zero raise EvalError.
       - '%' must use Python's `math.fmod` semantics (sign follows left operand).
       - '^' represents exponentiation. Any arithmetic exceptions (overflow, negative base with fractional exponent) must raise EvalError.
       - Malformed RPN stream or empty list raises EvalError.

  4. calc.py:
     - Implement `calculate(source: str) -> float` which runs the entire pipeline (tokenize, to_rpn, and eval_rpn).
     - Implement `main(argv: list[str]) -> int`.
       - Takes argument list without the program name (argv), joins arguments with single spaces into one expression string.
       - Prints the result with repr(float) formatting via print(value), returning 0.
       - If argv is empty, prints 'usage: calc.py <expression>' and returns 2.
       - On LexError, ParseError, or EvalError, prints 'error: <message>' and returns 1.

  Modify only `lexer.py`, `rpn.py`, `evaluate.py` and `calc.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

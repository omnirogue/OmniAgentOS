prompt: |
  Your task is to implement three independent validator modules inside the `validators/` package.
  These three tasks are completely independent of one another, do not share constraints, and can be completed in any order or even in parallel if you have a way to do so.

  ### Deliverable 1: ISBN Validator (`validators/isbn.py`)
  Implement the following functions:
  * `def normalize_isbn(raw: str) -> str`
    Strips ASCII spaces and hyphens from `raw`, and uppercases the result. Nothing else is removed.
  * `def is_valid_isbn10(raw: str) -> bool`
    Checks if the normalized version of `raw` is a valid ISBN-10 string.
    - An ISBN-10 is exactly 10 characters long after normalization.
    - The first 9 characters must be ASCII digits '0'-'9'.
    - The 10th character must be an ASCII digit '0'-'9' or 'X' (case-insensitive, representing value 10; note that normalize_isbn already uppercases it).
    - It is valid if: `sum((10 - i) * value(c_i) for i in range(10)) % 11 == 0`, where `c_i` is the character at 0-based index `i`, and `value(c_i)` is the integer value of the character (0-9 for digits, or 10 for 'X').
    - Returns `False` for wrong length, disallowed characters, or incorrect checksum. This function must never raise any exceptions.
  * `def is_valid_isbn13(raw: str) -> bool`
    Checks if the normalized version of `raw` is a valid ISBN-13 string.
    - An ISBN-13 is exactly 13 characters long after normalization, and consists entirely of ASCII digits '0'-'9'.
    - It is valid if: `sum(d_i * (1 if i % 2 == 0 else 3) for i in range(13)) % 10 == 0`, where `d_i` is the digit value at 0-based index `i`.
    - Returns `False` for wrong length, disallowed characters, or incorrect checksum. This function must never raise any exceptions.

  ### Deliverable 2: Card / Luhn Validator (`validators/luhn.py`)
  Implement the following functions:
  * `def luhn_checksum(digits: str) -> int`
    Assumes `digits` consists only of digit characters (the caller guarantees this; no validation required here).
    Returns the Luhn sum modulo 10:
    - Double every second digit counting from the right (i.e. positions 1, 3, 5, ... from the right, 0-based from the right).
    - If a doubled value is greater than 9, subtract 9 from it (e.g., 8 becomes 16, then subtract 9 to get 7; 5 becomes 10, then subtract 9 to get 1).
    - Sum all these modified and unmodified digit values.
    - Return `total % 10`.
  * `def is_valid_card(raw: str) -> bool`
    Validates a card number raw string.
    - Strips all ASCII spaces and hyphens from the string.
    - It is valid if: after stripping, the length is between 13 and 19 characters (inclusive), it consists entirely of digits, and its `luhn_checksum` is equal to 0.
    - Returns `False` on any invalidity and must never raise any exceptions.
  * `def card_brand(raw: str) -> str`
    Identifies the brand of a card number.
    - If `is_valid_card(raw)` is `False`, returns `"invalid"`.
    - Otherwise, returns:
      - `"visa"` if the stripped string starts with `4` and its length is either 13 or 16.
      - `"mastercard"` if the stripped string starts with two digits in the range `51` to `55` (inclusive).
      - `"amex"` if the stripped string starts with `34` or `37` and its length is 15.
      - `"unknown"` in all other cases of a valid card.

  ### Deliverable 3: SemVer Validator (`validators/semver.py`)
  Implement the following:
  * An exception class `InvalidVersion` which inherits from Python's standard `ValueError`.
  * `def parse_version(raw: str) -> tuple[int, int, int, tuple[str, ...]]`
    Parses a semantic version string.
    - The format is `MAJOR.MINOR.PATCH` optionally followed by `-` and a prerelease made of dot-separated identifiers.
    - MAJOR, MINOR, and PATCH must be non-negative integers.
    - MAJOR, MINOR, and PATCH must NOT have leading zeros (except the single digit `0` itself, e.g. `0.1.0` is valid, but `01.0.0` is invalid).
    - The prerelease part starts with the first `-` after the MAJOR.MINOR.PATCH portion. It consists of one or more dot-separated identifiers (e.g., `1.0.0-alpha.1` has prerelease identifiers `("alpha", "1")`).
    - Prerelease identifiers must be non-empty and consist only of ASCII alphanumerics and hyphens `[0-9A-Za-z-]`.
    - If a prerelease identifier contains only digits, it must NOT have leading zeros (e.g., `1.0.0-alpha.01` is invalid, but `1.0.0-alpha.1` or `1.0.0-alpha.beta` is valid).
    - Build metadata is NOT supported. A `+` character anywhere in the input is invalid.
    - If the input is malformed, raise `InvalidVersion`.
    - Returns a tuple: `(major, minor, patch, prerelease_tuple)`. If there is no prerelease, returns `(major, minor, patch, ())`.
  * `def compare_versions(a: str, b: str) -> int`
    Compares version string `a` to version string `b`.
    - If either version string is invalid (or contains `+`), raise `InvalidVersion`.
    - Returns:
      - `-1` if version `a` is less than version `b`.
      - `0` if version `a` is equal to version `b`.
      - `1` if version `a` is greater than version `b`.
    - Comparison rules:
      - Compare MAJOR, MINOR, PATCH numerically first.
      - A version WITH a prerelease is LOWER than the same version WITHOUT a prerelease (e.g., `1.0.0-alpha` < `1.0.0`).
      - Two prereleases are compared identifier by identifier:
        - If both identifiers consist only of digits, compare them numerically.
        - If both are non-numeric (or if at least one is non-numeric), compare them lexicographically by their ASCII character codes.
        - Numeric identifiers are always lower than non-numeric identifiers.
        - If all compared identifiers are equal, the version with FEWER identifiers is lower (e.g., `1.0.0-alpha` < `1.0.0-alpha.1`).
  * `def latest(versions: list[str]) -> str`
    Returns the highest version string from the non-empty list of version strings `versions`, using the comparison logic defined above.
    - If the list is empty, raise `ValueError`.
    - If any version string in the list is invalid, raise `InvalidVersion`.

  ### Constraints & Scope
  Modify only `validators/isbn.py`, `validators/luhn.py` and `validators/semver.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

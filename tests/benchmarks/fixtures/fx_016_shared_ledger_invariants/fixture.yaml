prompt: |
  Your task is to fix a bug in a shared multi-operation ledger system where direct mutations of ledger state break invariants, bypass logging, and can leave the ledger in a partially-mutated (torn) state when operations fail midway.

  To solve this, you must introduce a transactional entry point to validate and apply multi-account movements atomically, and refactor the individual operation modules to route through this transaction engine.

  ### Context & Requirements

  1. **The Shared Store (`store.py`):**
     The ledger is represented by the `Ledger` class, which tracks account balances, an append-only transaction journal, and a set of already applied transaction IDs:

     ```python
     @dataclass
     class Ledger:
         balances: dict[str, int]
         journal: list[Entry]           # append-only
         applied: set[str]              # txn ids already applied
     ```

     `Entry` is a frozen dataclass representing a single account adjustment:
     ```python
     @dataclass(frozen=True)
     class Entry:
         txn_id: str
         account: str
         delta: int
         kind: str
     ```

     You must implement a transactional function `apply_txn` in `store.py` with the following signature:
     ```python
     def apply_txn(ledger: Ledger, txn_id: str, kind: str, moves: list[tuple[str, int]]) -> bool
     ```

     - **Atomicity & Exceptions:** All moves in the transaction must be applied atomically. If any move is invalid, the entire transaction is rejected: no balances are changed, no journal entries are recorded, and the transaction ID is not added to the `applied` set. In case of rejection, raise a `LedgerError` (which is already defined in `store.py` and inherits from `ValueError`).
     - **Validation Rules:**
       - The `moves` list cannot be empty.
       - All account names specified in `moves` must exist in `ledger.balances`.
       - The sum of all deltas in `moves` must be exactly 0 if `kind == "transfer"`.
       - The resulting balance of any account after applying the transaction moves must not be negative (i.e. no overdrafts allowed).
     - **Idempotency:** Before performing any validation or modifications, check if `txn_id` is already in `ledger.applied`. If the `txn_id` is already applied, do nothing (do not mutate balances, record to journal, or raise an error) and return `False`. A newly applied transaction returns `True`.
     - **Success Effects:** On successful validation, append one `Entry` per move to `ledger.journal` in the order given, apply the updates to `ledger.balances`, add `txn_id` to `ledger.applied`, and return `True`. Note that the journal is append-only and existing entries must never be modified or removed.

  2. **The Operation Modules (`ops/deposit.py`, `ops/withdraw.py`, `ops/transfer.py`):**
     Refactor the three operation modules to perform NO direct mutation of `ledger.balances` or `ledger.journal`. Every ledger update must be performed by delegating to `store.apply_txn` with the appropriate `kind` (`"deposit"`, `"withdraw"`, `"transfer"`):
     
     - **`ops/deposit.py`:**
       - Signature: `def deposit(ledger: Ledger, txn_id: str, account: str, amount: int) -> bool`
       - Behavior: Checks if `amount` is positive. If non-positive, raises a `LedgerError`. Otherwise, routes through `apply_txn` with `kind="deposit"` and a single move `(account, amount)`.
     
     - **`ops/withdraw.py`:**
       - Signature: `def withdraw(ledger: Ledger, txn_id: str, account: str, amount: int) -> bool`
       - Behavior: Checks if `amount` is positive. If non-positive, raises a `LedgerError`. Otherwise, routes through `apply_txn` with `kind="withdraw"` and a single move `(account, -amount)`.
     
     - **`ops/transfer.py`:**
       - Signature: `def transfer(ledger: Ledger, txn_id: str, src: str, dst: str, amount: int) -> bool`
       - Behavior: Checks if `amount` is positive. If non-positive, raises a `LedgerError`. Also checks that source and destination are different (`src != dst`), raising a `LedgerError` if they are the same. Otherwise, routes through `apply_txn` with `kind="transfer"` and two moves: first a debit to `src` of `-amount`, and second a credit to `dst` of `amount`.

  ### Expected Invariants & Verification
  The system guarantees:
  - Total sum of balances `total(ledger)` remains conserved across transfers.
  - Replaying journal deltas starting from the opening balances must reproduce the current balances exactly.
  - Replaying the same transaction ID multiple times must return `False` and have no effect.
  - Any failed operation must leave the ledger state absolutely untouched (no partial updates).

  Modify only `store.py`, `ops/deposit.py`, `ops/withdraw.py` and `ops/transfer.py`. Do not modify `check_ledger.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

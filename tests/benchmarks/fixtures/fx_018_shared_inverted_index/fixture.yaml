prompt: |
  We have a simple document store that maintains a document dictionary `docs`, a shared inverted index `index` mapping each term to the set of document IDs containing it, and a `revision` counter.
  
  Currently, the document store functions correctly for pure lookups, but the mutation operations in the `ops/` directory are buggy. They directly mutate the `store.docs` dictionary without updating the `store.index` or incrementing `store.revision`. Consequently, the index immediately goes out of sync (stale) upon any mutation.
  
  Your task is to fix this by introducing a central, incremental change application method and routing all mutations through it.
  
  ### Requirements:
  
  1. Implement `apply_change` in `store.py`:
     ```python
     def apply_change(store: Store, doc_id: str, new_text: str | None) -> None
     ```
     - If `new_text is None`, this deletes the document with `doc_id`. If `doc_id` is not in the store, raise `StoreError` (which is defined in `store.py` and subclasses `ValueError`).
     - If `new_text` is a string, it inserts or replaces (rewrites) the document. If `new_text` is empty or contains only whitespace, raise `StoreError` and make no changes.
     - The index must be updated INCREMENTALLY:
       - Add `doc_id` under each new term.
       - Remove `doc_id` from terms that are no longer present in the updated text.
       - Completely delete term keys from `store.index` once their associated document ID set becomes empty. Keeping keys with empty sets is considered a leak.
     - Increment `store.revision` by exactly 1 for each successfully applied change (whether it is an addition, a deletion, or an update/rewrite).
     - If any validation fails (e.g., duplicate add, invalid/empty text, or unknown delete/rewrite), raise `StoreError` and leave the store (including `docs`, `index`, and `revision`) completely unchanged.
  
  2. Update the three operations in `ops/` to use `apply_change`:
     - `ops/add.py`: `add_document(store, doc_id, text)`. It must raise `StoreError` if `doc_id` already exists.
     - `ops/remove.py`: `remove_document(store, doc_id)`. It must delegate deletion of `doc_id` to `apply_change`.
     - `ops/rewrite.py`: `rewrite_document(store, doc_id, text)`. It must raise `StoreError` if `doc_id` does not exist. It must NOT be implemented as a remove-then-add operation; the revision counter must advance by exactly 1.
     - Crucially, the operations in `ops/` must perform NO direct mutation on `store.docs`, `store.index`, or `store.revision` — every change must route through `apply_change`.
  
  3. Ensure that after any sequence of operations, the store's state remains perfectly coherent:
     - `store.index == rebuild_index(store)`
     - No empty term sets are left in `store.index`
     - `store.revision` equals the number of successfully applied changes.
  
  Modify only `store.py`, `ops/add.py`, `ops/remove.py` and `ops/rewrite.py`. Do not modify `check_store.py` or anything under `corpus/`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

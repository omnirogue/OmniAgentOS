prompt: |
  Implement a three-stage sequential configuration processing pipeline in Python. The pipeline consists of parsing raw INI text, resolving textual section/key references, and providing a unified command-line interface.

  ### Stage 1 - `iniparse.py`
  Implement:
  ```python
  def parse_ini(text: str) -> dict[str, dict[str, str]]
  ```
  Rules:
  - `[name]` on its own line opens a section (name stripped of surrounding whitespace).
  - `key = value` inside a section; key and value are each stripped; the FIRST `=` splits.
  - Blank lines, and lines whose first non-space character is `#` or `;`, are ignored. Comments are only recognised on their own line (first non-space character `#` or `;`); a `#` or `;` appearing after a value is part of the value.
  - A duplicate key inside one section: the LAST occurrence wins.
  - A `key = value` line before any section header raises `IniError`.
  - A non-blank, non-comment, non-header line with no `=` raises `IniError`.
  - `IniError` must be defined in `iniparse.py` and subclass `ValueError`. Its error message must contain the 1-based line number of the offending line.
  - An empty section (header, no keys) is present in the result with an empty dict.

  ### Stage 2 - `resolve.py`
  Implement:
  ```python
  def resolve(config: dict[str, dict[str, str]]) -> dict[str, dict[str, str]]
  ```
  Rules:
  - Expands every `${section.key}` placeholder in every value, repeatedly, until no placeholders remain. Expansion is textual and a substituted value may itself contain placeholders.
  - `${...}` whose target section or key does not exist raises `MissingReference`.
  - A reference cycle raises `CircularReference`.
  - Both exceptions must be defined in `resolve.py` and subclass `ValueError`. The `CircularReference` message must contain the `section.key` of at least one member of the cycle.
  - A `$` not followed by `{` is a literal `$`.
  - The input dict must not be mutated.

  ### Stage 3 - `cli.py`
  Implement:
  ```python
  def main(argv: list[str]) -> int
  ```
  Rules:
  - `argv` is the argument list WITHOUT the program name; exactly one element, a file path.
  - Reads the file, parses it, resolves it, then prints one line per key in the form `section.key=value`, sorted lexicographically by the whole `section.key` string, and returns 0.
  - Wrong number of arguments: print `usage: cli.py <config-path>` to stdout and return 2.
  - File missing: print `error: cannot read <path>` to stdout and return 2.
  - `IniError`, `MissingReference` or `CircularReference`: print `error: <exception message>` to stdout and return 1.
  - `cli.py` must also work as a script when executed directly.

  Modify only `iniparse.py`, `resolve.py` and `cli.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

prompt: |
  Implement a deterministic diffing, patching, and verification engine for sequences of strings.
  All code must be written in Python 3.12 using the standard library only (no third-party imports).

  The system consists of three modules:

  1. `mydiff.py`
  This module computes the longest common subsequence (LCS) and generates a minimal edit script.
  It must define and implement the following:

  - `Op = tuple[str, str]` (a type alias for a pair where the first element is the tag and the second is the line). The tag can be "=" (keep), "-" (delete), or "+" (insert).
  - `def lcs_length(a: list[str], b: list[str]) -> int`
    Computes the classic dynamic-programming longest-common-subsequence length of the two lists of lines.
  - `def diff_lines(a: list[str], b: list[str]) -> list[Op]`
    Returns a minimal edit script mapping sequence `a` to sequence `b`.
    The number of deleted lines (tag "-") plus the number of inserted lines (tag "+") must equal `len(a) + len(b) - 2 * lcs_length(a, b)`.
    When reading the returned operations list from left to right:
      - The "=" and "-" lines in order must reproduce `a` exactly.
      - The "=" and "+" lines in order must reproduce `b` exactly.
    To ensure the output is completely deterministic, use the following tie-break rules during backtracking of the DP table:
      - When backtracking from `(i, j) = (len(a), len(b))` to `(0, 0)`:
        - If `i > 0` and `j > 0` and `a[i - 1] == b[j - 1]`, prefer taking a match (tag "=") and move diagonally to `(i - 1, j - 1)`.
        - When backtracking at a cell where `a[i - 1] != b[j - 1]` (or we must choose between deletion and insertion), if both deletion and insertion lead to optimal paths (i.e. `dp[i][j - 1] == dp[i - 1][j]`), prefer the insertion (move to `(i, j - 1)` first, which places the "+" op *after* the "-" op in the final reconstructed list), and emit the DELETION before the INSERTION in the final returned left-to-right order.
        - If one path is strictly better, follow that path (move to the neighbor with the larger DP value).
    Empty inputs are allowed on either side.

  2. `mypatch.py`
  This module applies an edit script or inverts it.
  It must define and implement the following:

  - `class PatchError(ValueError)`: A custom exception representing a patch application error.
  - `def apply_ops(a: list[str], ops: list[Op]) -> list[str]`
    Applies the sequence of ops to `a` to produce a new list of strings.
    It walks through `ops` and processes each:
      - "=": consumes one line from `a` (which must match the op's line exactly) and emits it.
      - "-": consumes one line from `a` (which must match the op's line exactly) and emits nothing.
      - "+": emits the op's line and consumes nothing.
    If there is any line content mismatch, an unknown tag, unexpected end of input lines while applying an op, or leftover input lines in `a` after all ops have been processed, a `PatchError` must be raised.
    The exception's error message must contain the 0-based index of the offending op in `ops`. For leftover input lines at the end, use the length of the ops list as the index.
  - `def invert_ops(ops: list[Op]) -> list[Op]`
    Returns an inverted operations list that will patch the output `b` back to the original `a`.
    It swaps "-" and "+", keeping "=" the same. It must satisfy:
    `apply_ops(apply_ops(a, ops), invert_ops(ops)) == a`.

  3. `roundtrip.py`
  This module provides high-level verification and stats.
  It must define and implement:

  - `def verify(a: list[str], b: list[str]) -> bool`
    Returns `True` if applying the diff of `a` and `b` to `a` yields `b` AND the inverse round-trip also holds.
    If any step raises `PatchError`, it must catch the exception and return `False` instead of propagating it.
  - `def stats(ops: list[Op]) -> dict[str, int]`
    Returns a dictionary showing counts of each operation: `{"same": same_count, "removed": removed_count, "added": added_count}`.
  - `def summarize(a: list[str], b: list[str]) -> str`
    Computes the diff of `a` and `b` and returns a summary line of the form: `"+{added} -{removed} ={same}"` (for example, `"+2 -1 =3"`).

  Modify only `mydiff.py`, `mypatch.py` and `roundtrip.py`. Every other file in this directory is out of scope — do not read, edit, create, or delete anything else.

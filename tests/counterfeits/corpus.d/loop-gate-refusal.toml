[[counterfeit]]
id = "cf-loop-gate-classified-by-spelling"
patch = "patches/cf-loop-gate-classified-by-spelling.patch"
rationale = """Classifies a gate target by what the command SPELLED instead of where the
path really resolves — "we already have the string, why touch the filesystem". The
executor does not agree: `gate_runner` resolves every target inode-anchored and
symlink-following before running it, so a gate spelled `aliases/scheduler_suite.py` that
symlinks into tests/scheduler/ passes validation and then RUNS the machinery. Two
definitions of one path is this repo's settled-definition-divergence class (four prior
incidents), and it is invisible: the row validates, the gate executes, the evidence is
signed, and the verdict is about the scheduler rather than the loop."""
must_fail = [
  "tests/scheduler/test_loop_gate_refusal.py::test_a_symlink_alias_to_the_machinery_is_refused_by_its_REAL_location",
]
failure_re = "DID NOT RAISE|grades the loop machinery|assert"

[[counterfeit]]
id = "cf-loop-blanket-gate-admitted"
patch = "patches/cf-loop-blanket-gate-admitted.patch"
rationale = """Drops the "target CONTAINS the machinery" half of the prefix relation, so
`pytest tests` and `pytest .` are admitted again — the deliberately-scoped hole the first
version of this lane left open and Sol called a blocker. It is one word of edit away from
the refused spelling and it restores the whole defect: a blanket gate is green whenever
the tree is green and red whenever anything anywhere is red, so its verdict is
uncorrelated with what the instance did. The loop is self-graded again, this time by a
gate that looks MORE thorough than the honest one."""

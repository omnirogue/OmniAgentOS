# Counterfeit fragment — lane/loop-gate-refusal.
#
# One defect class: a loop routine that is allowed to exist without a gate that
# can go RED on its own work. Every entry below leaves the loop WORKING — it
# ticks, it reports, it settles — and only removes the one thing authorised to
# contradict the loop's own account of itself. That is the signature of this
# class, and it is why "the suite is green" proves nothing about it: the shipped
# defect was green for a whole day while rtn_1e5567b9f3314a2c9d76 reported ten
# accepted runs and healed nothing.

[[counterfeit]]
id = "cf-loop-gate-default-restored"
patch = "patches/cf-loop-gate-default-restored.patch"
rationale = """Puts the silent default back: `DEFAULT_GATE_COMMAND = "pytest
tests/scheduler/test_loop_jobs.py"` and `gate_command: str = DEFAULT_GATE_COMMAND`. This
is the shipped defect verbatim. It reads like a convenience — every other seeding
parameter has a sensible default, why not this one — and it is the whole bug: the
substituted command grades the scheduler→worker MECHANISM, which is identical for every
loop instance and passes on every tick whatever the loop produced, so an author who
simply forgot a gate got a loop that settles favourable over garbage forever. Nothing
about the row looks wrong: it validates, it registers, it fires, its gate really executes
and really passes."""
must_fail = [
  "tests/scheduler/test_loop_gate_refusal.py::test_the_seeding_helper_has_no_default_gate_command",
]
failure_re = "a default gate command is the defect|must have no default|DID NOT RAISE|assert"

[[counterfeit]]
id = "cf-loop-machinery-gate-admitted"
patch = "patches/cf-loop-machinery-gate-admitted.patch"
rationale = """Drops the `_validate_loop_gate` call from `validate_routine` — a one-line
"the store belt already covers this" simplification. It does not: the D5 belt asks
whether an ACTIVE mock row ships a recognized verifier, and the machinery suite IS one,
so the row persists and the loop grades itself again. It also re-opens the gateless
metric_threshold loop, which the belt refuses two layers later with a message about
harnesses that names neither the gate nor the fix. Restoring the helper's default is
harmless while this rule stands and fatal the moment it does not, which is exactly why
the refusal lives in the validator every write path reaches."""
must_fail = [
  "tests/scheduler/test_loop_gate_refusal.py::test_a_loop_row_gated_on_the_loop_machinery_is_refused_at_creation",
  "tests/scheduler/test_loop_gate_refusal.py::test_a_loop_row_with_no_gate_command_is_refused_with_the_loop_specific_remedy",
  "tests/scheduler/test_loop_gate_refusal.py::test_the_machinery_gate_is_refused_by_the_loop_rule_not_by_the_D5_belt",
  "tests/scheduler/test_loop_gate_refusal.py::test_an_update_cannot_swap_an_honest_loop_gate_for_the_machinery_suite",
]
failure_re = "DID NOT RAISE|grades the loop machinery|must declare gate_config.command|assert"

[[counterfeit]]
id = "cf-loop-gate-rule-keyed-on-kind"
patch = "patches/cf-loop-gate-rule-keyed-on-kind.patch"
rationale = """Narrows the rule to rows whose `task_template.input.kind == "loop"`,
which looks like a tightening and is a bypass: `loop_jobs._spec` dispatches on
`input.module` and never reads `kind`, so a row with any other kind still launches a loop
worker while sailing past the gate check. The refusal must be keyed on what EXECUTES the
row, never on what the row calls itself — a self-description is exactly the kind of
evidence this whole subsystem exists to refuse."""
must_fail = [
  "tests/scheduler/test_loop_gate_refusal.py::test_the_refusal_is_keyed_on_the_loop_MODULE_not_on_input_kind",
]
failure_re = "DID NOT RAISE|grades the loop machinery|assert"


  "tests/scheduler/test_loop_gate_refusal.py::test_a_blanket_gate_over_the_whole_tree_is_refused[python -m pytest .]",
]
failure_re = "DID NOT RAISE|blanket gate|assert"

[[counterfeit]]
id = "cf-loop-gate-draft-exemption-escape"
patch = "patches/cf-loop-gate-draft-exemption-escape.patch"
rationale = """Treats the loop-gate rule as an ACTIVATION rule rather than a shape rule:
it runs after the status-keyed draft exemption again, and the DAL's `set_status` /
`set_status_cas` stop asking it. Each edit looks defensible on its own (drafts are
allowed to be incomplete; status flips are documented not to re-validate shape), and
together they are a complete bypass — seed the gateless loop `disabled`, flip it active
through the DAL, and the rule has run exactly zero times on a row that is now firing
every ten minutes. This is the escape Sol found, and it is why the rule is checked on the
payload's shape and every transition to active is belted."""
must_fail = [
  "tests/scheduler/test_loop_gate_refusal.py::test_a_gateless_loop_row_is_refused_even_as_a_DISABLED_draft",
  "tests/scheduler/test_loop_gate_refusal.py::test_a_legacy_gateless_loop_row_cannot_be_flipped_ACTIVE_through_the_DAL[False]",

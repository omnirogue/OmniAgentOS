[[counterfeit]]
id = "cf-loop-decoy-gate-type-admitted"
patch = "patches/cf-loop-decoy-gate-type-admitted.patch"
rationale = """Stops asking what the gate TYPE is — "a declared command is a declared
gate" — so a loop with `gate_type='metric_threshold'` and an honest instance-test command
sitting beside it is admitted at create and at both DAL activation belts. Nothing ever
executes that string: `routines_settle` only runs the command of a type in
EXECUTED_GATE_TYPES, so the row settles `gate_passed=NULL` on every tick while reading as
a properly gated loop in every list, dashboard and review. It is the original
self-grading incident with a decoy in the window, and it is the shape a reviewer is most
likely to wave through."""

# Counterfeit fragment — lane/clock-gate-honest.
#
# The grandfather clock gate is the reference implementation every future loop
# will copy, and it shipped in 0249b28a with three ways of being green while
# knowing nothing. Two independent cross-lineage reviews then found three more
# in the FIX. All of them were reproduced by hand before these entries were
# written; each patch below restores one, in the shape a future reader would
# actually reach for — every rationale is a real argument, because a counterfeit
# nobody would plausibly write proves nothing about the guard.
#
# The `must_fail` targets all live in tests/test_grandfather_clock_gate_selftest.py
# for two mechanical reasons: the harness runs node ids WITHOUT `-o addopts=`
# and the gate file itself is `e2e`-marked (it reads the operator's filed
# artifact), and the harness executes every node id on the PRODUCTION venv, so
# a target under loops/tests/ could not be imported at all. That second reason
# is why the instance's own guarantees are graded in the selftest.

[[counterfeit]]
id = "cf-clock-gate-latest-dated-dir-wins"
patch = "patches/cf-clock-gate-latest-dated-dir-wins.patch"
rationale = """Restores the shipped defect: `get_artifact_path` returns the artifact in the
newest dated directory with no binding to any run — no stamp, no freshness, no agreement
between the directory's date and the artifact's own. The comment sells it as removing
ceremony, and on a machine where the loop ran an hour ago it changes nothing visible.
Reproduced against the merged code with Kimi's attack: `HOME=<fake home>` containing a
hand-written `Grandfather-Clock-<yesterday>/clock.html` -> 9 passed, stale AND foreign.
That is not a weak gate, it is an inverted one: if the loop breaks or stops firing,
yesterday's file keeps the gate green, settlement records FAVOURABLE, acceptance stays
1.0, and the >=3-judged-adverse auto-pause floor (routines.py) can never trip. A dead
loop runs green forever, and every loop that copies this template inherits it."""
must_fail = [
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_an_unstamped_artifact",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_an_artifact_from_a_previous_clock_day",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_a_stamp_that_disagrees_with_its_directory",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_a_future_dated_stamp",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_an_artifact_stamped_by_another_instance",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_an_artifact_with_no_run_id",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_a_copy_of_a_valid_artifact",
]
failure_re = "DID NOT RAISE|assert"


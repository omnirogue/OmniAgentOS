[[counterfeit]]
id = "cf-clock-mtime-corroboration-dropped"
patch = "patches/cf-clock-mtime-corroboration-dropped.patch"
rationale = """Drops the check that the file's mtime agrees with the stamp it carries. The
removal argument is half right, and this rationale used to be wrong about which half:
`cp -p`, `rsync -a`, `ditto`, `tar xp` and `shutil.copy2` do NOT rewrite the mtime, they
RESTORE the source's, so an mtime agreeing with a stamp is no evidence of origin against
those. The other half still stands. The copiers that do rewrite it — plain `cp`, a git
checkout, a re-render — are the ordinary ones, and against them the disagreement is what
separates a certified copy from the real thing; the operator's tree has exactly one writer,
and `publish` takes the instant, renders the stamp and writes the bytes inside one call, so
the two cannot disagree in an artifact this loop produced. The metadata-preserving copy is
caught one rule further down, by the inode check (`st_ctime`, the one timestamp no copier
can restore). Removing THIS rule re-opens run attribution to anyone with `cp`."""
must_fail = [
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_a_copy_of_a_valid_artifact",
]
failure_re = "DID NOT RAISE|assert"

[[counterfeit]]
id = "cf-clock-inode-corroboration-dropped"
patch = "patches/cf-clock-inode-corroboration-dropped.patch"
rationale = """Drops the check that the artifact's inode is as old as the stamp it carries,
with the best argument against it — `st_ctime` moves on ANY inode change, so a chmod, an
xattr or a hardlink on a perfectly good clock refuses it, and manufacturing adverse
settlements against correct work is the exact sin this lane exists to undo. That cost is
real and it is written down where the rule is defined. It is paid because `st_ctime` is the
ONLY timestamp on the file that a copier cannot restore: `cp -p`, `rsync -a`, `ditto`,
`tar xp` and `shutil.copy2` all put the source's mtime AND (on APFS) its birthtime on the
copy, so with this rule gone a valid artifact copied into the operator's tree agrees with
its own stamp on every column the gate can read, and replay is free again. Measured, not
argued: setattrlist(ATTR_CMN_CHGTIME) returns success and changes nothing, while
setattrlist(ATTR_CMN_CRTIME) sets birthtime outright and os.utime drags it backwards on its
own. Removing this rule returns the gate to grading whether someone once produced a good
clock, not whether one was produced now."""
must_fail = [
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_a_metadata_preserving_copy[cp-p]",
  "tests/test_grandfather_clock_gate_selftest.py::test_gate_refuses_a_metadata_preserving_copy[rsync-a]",
]
failure_re = "DID NOT RAISE|assert"


[[counterfeit]]
id = "cf-clock-filing-follows-symlinks"
patch = "patches/cf-clock-filing-follows-symlinks.patch"
rationale = """Returns both write sites to `Path.write_text`. The comment's objection is
real — a temp sibling can be left behind by a process that dies mid-write, and the
operator's directory is the one place a stray dotfile is visible — and the plain write is
simpler, which is how it got here in the first place. `write_text` opens for writing and
FOLLOWS a symlink, and the dated directory's name is derived from the calendar, so
anything running as the operator can create tomorrow's directory today and plant
`clock.html -> <any operator-writable file>`. The loop then overwrites that file
UNATTENDED, on a timer, which is precisely when nobody is watching. No privilege boundary
is crossed, which is why this is hardening and not an emergency; the reason it is worth
the temp file anyway is that `os.replace` acts on the LINK rather than on what it points
at, and it makes the gate's read atomic as a side effect."""
must_fail = [
  "tests/test_grandfather_clock_gate_selftest.py::test_filing_replaces_a_planted_symlink_instead_of_writing_through_it",

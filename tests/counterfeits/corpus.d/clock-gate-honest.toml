[[counterfeit]]
id = "cf-clock-publish-key-not-per-run"
patch = "patches/cf-clock-publish-key-not-per-run.patch"
rationale = """Removes the run id from the candidate and mints one at filing time instead.
The comment states the exact reasoning this instance shipped with, and it is the reasoning
a careful reader reconstructs: `generate_evaluate_improve` digests the candidate into the
publish effect's business key, and a candidate that changes every tick means the receipt
guard no longer de-duplicates a replayed superstep (P1/P7). The cost was never counted.
The receipt table has no expiry, so a byte-deterministic candidate produces ONE key for
all time and the first successful publish suppresses every later one: measured on
2026-08-02, two ticks against one control plane, the second reporting status=completed
while the filed artifact still carried the FIRST tick's stamp and mtime. That second run
is then certified against a file it never wrote. Minting the id at filing time looks like
it restores attribution and does not — the value verify() compares against comes from the
ARGUMENTS, so an id the writer chose a moment earlier checks nothing but itself.
Cross-tick de-duplication was never a safety property here: the effect is an idempotent
overwrite of a path derived from arguments."""
must_fail = [
  "tests/test_grandfather_clock_gate_selftest.py::test_the_publish_business_key_is_per_run",
  "tests/test_grandfather_clock_gate_selftest.py::test_publish_refuses_a_candidate_with_no_run_id",
  "tests/test_grandfather_clock_gate_selftest.py::test_verify_refuses_a_predecessors_artifact",

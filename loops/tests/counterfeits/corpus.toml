# Loop-runtime counterfeit corpus.
#
# One entry per template (the plan's requirement) plus the two cross-cutting
# safety properties every template depends on: fail-closed approval expiry and
# the execution seam's independent re-check.
#
# `find` must match EXACTLY ONCE in `file` — a stale anchor is a hard error, not
# a skip, so a refactor that moves a guard cannot silently disarm its counterfeit.

# --- draft_approve_send: "strip the approval gate" -------------------------
[[counterfeit]]
id = "cf-t2-approval-floor-dropped"
primary_template = "draft_approve_send"
file = "omniagentos_loops/policy_gate.py"
find = "if decision.requires_approval or tool.tier >= APPROVAL_FLOOR_TIER:"
replace = "if decision.requires_approval:"
rationale = """Defers entirely to ActionClass policy, dropping the unattended-loop floor.
Under AUTO mode CONSEQUENTIAL auto-executes, so every T2 outbound send would fire
with no approvals row and no human — while every 'policy is consulted' test stays green."""
must_fail = [
  "tests/test_bridge_policy.py::test_t2_and_above_always_require_approval",
  "tests/test_approvals_bridge.py::test_first_tick_parks_and_creates_exactly_one_pending_row",
]
failure_re = "must park|assert .*PARKED|LoopStatus"


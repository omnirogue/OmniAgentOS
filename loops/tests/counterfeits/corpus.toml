id = "cf-seam-absence-scored-as-failure"
primary_template = ""
file = "omniagentos_loops/parent_seam.py"
find = """    if outcome == OUTCOME_UNAVAILABLE:
        raise EffectUnavailable("""
replace = """    if outcome == OUTCOME_UNAVAILABLE:
        return _refusal(response)
    if False:
        raise EffectUnavailable("""
rationale = """Re-arms the 2026-07-31 defect one level down: an authority the parent could
not REACH is recorded as a failed effect instead of an absence. The receipt is filed
'failed', the attempt budget burns on someone else's outage, and the tick settles
adverse — while every 'the seam returns a result' test stays green."""
must_fail = [
  "tests/test_parent_seam.py::test_an_unreachable_authority_is_absence_not_failure",
  "tests/test_parent_seam.py::test_an_unavailable_effect_settles_the_tick_neutral_and_loud",
]
failure_re = "EffectUnavailable|DID NOT RAISE|assert .*IDLE|absence"

# --- credential seam: "ambiguity treated as absence" -----------------------
[[counterfeit]]
id = "cf-seam-unknown-released-as-absence"
primary_template = ""
file = "omniagentos_loops/parent_seam.py"
find = """    raise EffectStateUnknown(
        f"{capability}: seam outcome {outcome!r} — {response.get('detail') or 'no detail'}"
    )"""
replace = """    raise EffectUnavailable(
        "unknown", f"{capability}: seam outcome {outcome!r}"
    )"""
rationale = """Collapses 'we could not establish what happened' into 'nothing happened'.
The receipt claim is then RELEASED for an effect that may well have run, so the next
tick re-executes it — the exact duplicate-external-effect hazard the receipt exists to
stop, reintroduced through the absence path."""
must_fail = [
  "tests/test_parent_seam.py::test_an_ambiguous_answer_leaves_the_receipt_claimed",
  "tests/test_parent_seam.py::test_an_unrecognised_outcome_is_not_a_success",
]
failure_re = "EffectStateUnknown|DID NOT RAISE|claimed"

# --- credential seam: "the actor grades itself" ----------------------------
[[counterfeit]]
id = "cf-render-verifier-trusts-the-renderer"
primary_template = ""
file = "omniagentos_loops/instances/render_probe.py"
find = """    item = dict(args.get("item") or {})
    verdict = image_verification(_render_args(item) if item else {}, instance_id=INSTANCE_ID)
    return Verification(ok=bool(verdict.get("verified")), detail=str(verdict.get("detail") or ""))"""
replace = """    if isinstance(_result, Mapping) and not _result.get("success", True) is False:
        return Verification(ok=True, detail="renderer reported success")
    item = dict(args.get("item") or {})
    verdict = image_verification(_render_args(item) if item else {}, instance_id=INSTANCE_ID)
    return Verification(ok=bool(verdict.get("verified")), detail=str(verdict.get("detail") or ""))"""
rationale = """Grades the effect from the ACTOR'S OWN ANSWER (EvidenceGrade.ACTOR_NARRATIVE)
instead of the artifact. The receipt is then marked verified whenever the API says
'succeeded', with no file on disk and no decoder consulted — the single defect the whole
verification-channel rule exists to prevent."""
must_fail = [
  "tests/test_parent_seam.py::test_image_verdict_ignores_a_fabricated_result",
]
failure_re = "assert|Verification|detail"

# --- credential seam: "existence is enough" --------------------------------
[[counterfeit]]
id = "cf-artifact-magic-bytes-unchecked"
primary_template = ""
file = "omniagentos_loops/artifacts.py"
find = "    if not any(payload.startswith(prefix) for prefix in prefixes):"
replace = "    if False:"
rationale = """Downgrades grade-2 evidence towards grade 1: nothing checks that the bytes
are the format the loop DECLARED, so the verdict is left entirely to whatever the decoder
makes of an arbitrary file. A JSON error page saved as rose.png then reaches the decoder,
which is a positively wrong answer either way — a decoder that shrugs would pass it, and
the one on this machine refuses in a way that is legible only because the magic check is
what makes 'not the image we asked for' a DECISIVE negative rather than noise."""
must_fail = [
  "tests/test_parent_seam.py::test_a_json_error_page_named_png_is_not_an_image",
]
failure_re = "could not decode|no pixel dimensions|magic number|assert"

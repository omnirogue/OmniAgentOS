    repro: "sqlite3 'file:.../var/runtime/state.sqlite3?mode=ro' \"SELECT name, total_runs, accepted_runs, neutral_runs, acceptance_rate, CAST(accepted_runs AS REAL)/(total_runs-neutral_runs) FROM routines WHERE total_runs>0\" — compare stored vs implied rate using (total_runs-neutral_runs), not total_runs."
    recommended_next_investigation: "No product action needed. Fixed 2026-08-06: test_routine_acceptance_rate_matches_judged_denominator now asserts equality against the judged-run denominator and would fail (correctly) on a genuine future write-path bug in omniagentos/scheduler/store.py."
    status: fixed-this-session
    discovered_run: livesim-author-workflow

  - id: LS-026
    title: "PRAGMA foreign_keys=ON is silently a no-op inside an open implicit transaction (test-authoring trap, not a product bug)"
    severity: info
    kind: observation
    category: memory
    suspected_subsystem: "any sqlite writer that toggles pragmas after failed DML (omniagentos/db/store.py does it correctly at connect time with isolation_level=None)"
    evidence: "While writing test_memlife_decisions_append_only_enforced: after a trigger-aborted UPDATE, python sqlite3's implicit transaction stayed open, PRAGMA foreign_keys=ON no-opped, and DELETE FROM memlife_candidates then deleted the parent WITHOUT cascading — leaving an orphaned decision row and no abort. Production connections are safe (store.py sets the pragma immediately after connect with isolation_level=None), but any ad-hoc script that enables FKs mid-connection can silently orphan memlife_decisions."
    repro: "sqlite3.connect(db) with default isolation_level; cause any aborted DML; then PRAGMA foreign_keys=ON; DELETE parent row -> no cascade, no trigger abort. Fixed in the test with conn.rollback() before the pragma."
    recommended_next_investigation: "PRAGMA foreign_keys=ON is silently a no-op inside an open implicit transaction (test-authoring trap, not a product bug) — see evidence"
    status: reported-by-livesim-author
    discovered_run: livesim-author-workflow

# LiveSim structured issue log.
#
# Every failure, flaky result, unexpected behaviour, security concern, and
# coverage gap found by LiveSim is logged here with evidence. This session does
# NOT fix product defects — these entries feed a separate repair-planning session.
#
# Entry schema:
#   id:            LS-### (stable)
#   title:         one line
#   severity:      P0 | P1 | P2 | P3
#   kind:          product | test-infra | coverage-gap
#   category:      the LiveSim category (reaper, api, memory, ...)
#   suspected_subsystem: file/module best guess
#   evidence:      ledger nodeid(s), evidence path(s), DB counts, curl output
#   repro:         exact command(s) to reproduce
#   recommended_next_investigation: what a repair session should look at first
#   status:        one of the ALLOWED STATUS VALUES below (free text is not
#                  permitted; the documents_open_defect collection hook in
#                  tests/livesim/conftest.py string-matches on the prefixes
#                  "fixed" and "fix-in-flight", so a status outside this list
#                  either fails that hook's cross-check or silently fails to
#                  trigger it -- both are bugs, not options):
#     open                        -- not yet investigated by a repair session
#     confirmed                   -- reproduced/verified as described
#     needs-rerun                 -- evidence stale, needs a fresh LiveSim pass
#     wont-fix-this-session       -- triaged, deliberately deferred
#     reported-by-livesim-author  -- default: logged by the LiveSim author run,
#                                    no repair-session verdict yet
#     fix-in-flight: <lane-id>    -- a lane (e.g. "A1", "lane/ls-fsguard-0806")
#                                    is actively landing the fix; any LiveSim
#                                    test still asserting the OBSERVED-broken
#                                    behaviour under this id is RACING that
#                                    lane and must be on the
#                                    documents_open_defect / strict-xfail path,
#                                    not a bare passing assertion
#     fixed-this-session          -- the LiveSim author fixed a TEST-INFRA bug
#                                    (kind: test-infra) in the same session
#                                    that found it (not a product fix)
#     fixed                       -- a product fix has landed and merged;
#                                    terminal state for a `kind: product` entry
#   discovered_run: run_id
schema: livesim-issues.v1

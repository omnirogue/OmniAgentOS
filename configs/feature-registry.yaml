      route_prefixes: []
      launchd_labels: []
      migration_patterns: ['*tool*', '*mount*', '*grant*']
      livesim_categories: [tools_permissions, files_fs]
      ui_paths: [/files, /connections, /capabilities]
  allocation:
    stable_id: feat.allocation
    aliases: [org]
    criticality: high
    blast_radius: estate
    expected_behavior: >-
      Projects, org hierarchy and accounts stay consistent, and allocation picks
      a provisioned agent for every accepted request.
    selectors:
      route_areas: [projects, hierarchy, org, orgdims, accounts, access, provision]
      route_prefixes: []
      launchd_labels: []
      migration_patterns: ['*project*', '*alloc*', '*account*', '*agent*']
      livesim_categories: []
      ui_paths: [/projects, /organization, /orgdims, /accounts]
  # ---- landed since 2026-07-31 (registered 2026-08-11, feature-health.yaml
  # sibling entries) ----------------------------------------------------------
  team_work_os:
    stable_id: feat.team_work_os
    aliases: [team]
    criticality: high
    blast_radius: estate
    expected_behavior: >-
      Team Work OS ingests attribution evidence, scores and verifies board
      tasks, and produces the scheduled team report without silent drops.
    selectors:
      route_areas: [team]
      route_prefixes: []
      launchd_labels: ['com.omniagentos.team-report', 'com.omniagentos.team-sweep']
      migration_patterns: ['*team*']
      livesim_categories: []
      ui_paths: [/team]
  landing_pipeline:
    stable_id: feat.landing_pipeline
    aliases: [gate_loop, threeloops]
    criticality: critical
    blast_radius: estate
    expected_behavior: >-
      The gate-loop assembles and lands trains, publish-queue drains claims on
      its timer, and the ledger stays append-only and readable under
      claim/park contention.
    selectors:
      route_areas: []
      route_prefixes: []
      # ARCHI does not inventory these plists (they live under
      # pipeline/launchd/, not the com.omniagentos.* set ARCHI tracks), so
      # this selector honestly documents ownership even though it currently
      # attributes zero ARCHI-sourced launchd items.
      launchd_labels: ['com.threeloops.*']
      migration_patterns: []
      livesim_categories: []
      ui_paths: []
  account_pool:
    stable_id: feat.account_pool
    aliases: [accounts]
    criticality: high
    blast_radius: estate
    expected_behavior: >-
      The pool of provider accounts rotates, pauses and resumes cleanly, and
      quota/cooldown state never silently strands a healthy account.
    selectors:
      # Contests with allocation's existing accounts/account selectors (both
      # entries pre-date this split); most-specific + alphabetical tiebreak
      # awards these to account_pool, which is the semantically correct owner
      # (omniagentos/accounts + omniagentos/routing/account_pool.py, not
      # allocation's org/project hierarchy). See report note.
      route_areas: [accounts]
      route_prefixes: []
      launchd_labels: []
      migration_patterns: ['*account*']
      livesim_categories: []
      ui_paths: [/accounts]
  control_plane:
    stable_id: feat.control_plane
    aliases: [loopdeck, engine]
    criticality: high
    blast_radius: estate
    expected_behavior: >-
      The LoopDeck engine API serves runs, tasks, approvals, budgets and
      disciplines consistently with the loop ledger it reads from.
    selectors:
      # Contests with api_ui's existing broad `control` area claim; alphabetical
      # tiebreak (api_ui < control_plane) keeps those routes attributed to
      # api_ui in generated output today — this selector documents the true
      # owner and shows up in `contested` rather than silently losing. See
      # report note.
      route_areas: [control]
      route_prefixes: []
      launchd_labels: []
      migration_patterns: ['*control_plane*']
      livesim_categories: []
      ui_paths: [/control-plane]
  northstar_cert:
    stable_id: feat.northstar_cert
    aliases: [nscert]
    criticality: medium
    blast_radius: subsystem
    expected_behavior: >-
      The certification instrument seeds holdouts, records cadence results and
      files gap findings without an instrument error reading as a candidate
      defect.
    selectors:
      route_areas: []
      route_prefixes: []
      launchd_labels: []
      migration_patterns: []
      livesim_categories: []
      ui_paths: []
  api_ui:
    stable_id: feat.api_ui
    aliases: [dashboard]
    criticality: high
    blast_radius: estate
    expected_behavior: >-
      The API serves the dashboard's surfaces with correct empty states, and

          auth: "basic:ZENDESK_BASIC_USER:ZENDESK_API_TOKEN"

  slack:
    label: "Slack"
    group: comms
    env:
      - SLACK_WEBHOOK_URL
      - OPS_ALERT_SLACK_WEBHOOK_URL
    capabilities:
      slack.post_internal:
        label: "Post to your own ops/alert channels"
        action_class: internal_reversible

  # Deliberately SEPARATE from `slack` above, not folded into it. Credential scope
  # in broker.resolve_for is CONNECTOR-scoped (broker._declared_env_names), so
  # adding the ingest tokens to `slack` would silently widen what
  # slack.post_internal can resolve. Two connectors keep the two scopes exact.
  slack_ingest:
    label: "Slack ingestion (Socket Mode push + reconciliation poll)"
    group: comms
    env:
      - SLACK_BOT_TOKEN
      - SLACK_APP_TOKEN
    capabilities:
      slack_ingest.stream:
        label: "Read public-channel messages (Socket Mode stream + conversations.history)"
        action_class: read_only
        # No http spec on purpose, so callable_now stays FALSE and nothing can
        # route an arbitrary request through this id. The tokens are consumed by
        # slack_sdk's own transports (a WebSocket for the app token, Web API GETs
        # for the bot token), not by broker.call's HTTP allowlist; what this
        # capability exists to pin is the CREDENTIAL SCOPE.
        #
        # Its two consumers, as a COMMENT and deliberately not `input_examples`:
        # that field marks a capability AMBIGUOUS for the tool-search
        # disambiguation surface (tests/toolplane/test_access_search_route.py
        # pins the exact set), and a capability with no http spec is not
        # routable, so it can never be the answer to a tool search.
        #   omniagentos.comms.sockets.slack        Socket Mode listener (app token)
        #   omniagentos.comms.poll --source slack  reconciliation sweep (bot token)

  # Deliberately SEPARATE from `slack` and `slack_ingest` (same reasoning as the
  # slack_ingest split above): credential scope is connector-scoped, so giving the
  # posting capability its own connector keeps SLACK_APP_TOKEN unresolvable from a
  # post and keeps the webhook connector unable to resolve the bot token.
  slack_post:
    label: "Slack posting (bot token, named internal channels)"
    group: comms
    env:
      - SLACK_BOT_TOKEN
    capabilities:
      slack_post.channel_message:
        label: "Post a message to a Slack channel as the bot"
        # consequential, NOT internal_reversible: the broker allowlist validates
        # the route but never inspects the `channel` body field, and
        # chat.postMessage accepts user IDs (opens a DM) and Slack Connect
        # channels -- so an unattended post could reach an external human. The
        # webhook-based slack.post_internal is not a precedent: it has no http
        # spec and is not broker-routable. Until a fail-closed channel-ID
        # allowlist is enforced at the broker seam, every bot post rides the
        # always-human rail (a bounded durable grant can cover a session).
        action_class: consequential
        http:
          base_url: "https://slack.com"
          methods: [POST]
          path_prefixes:
            - /api/chat.postMessage
          path_regex: '^/api/chat\.postMessage$'
          auth: "bearer:SLACK_BOT_TOKEN"

  zapier:
    label: "Zapier (MCP-connected apps)"
    group: comms
    env:
      - ZAPIER_MCP_CONFIG_URL
    capabilities:
      zapier.read:
        label: "Search and read data from connected apps"
        action_class: read_only
      zapier.trigger:
        label: "Trigger a configured Zap / connected-app action"
        # Ambiguous: the LABEL sounds like one bounded action; the actual reach is
        # whatever the MCP config exposes across 9000+ apps. Two "triggers" that read
        # identically here can be a Slack post and a wire transfer. No http spec is
        # pinned (callable_now is false), so these name the ACTION, not a route.
        input_examples:
          - "Zap 'ops-alert' — post a message to an internal Slack channel (reversible)"
          - "Zap 'billing-sync' — write to an external billing system (may move money)"
        # Scope is whatever the MCP config exposes -- unknown and variable across
        # 9000+ apps, and a Zap can invoke arbitrary actions (move money, delete
        # production data, message customers) that are individually irreversible
        # and unauditable ahead of time. That is the consequential tier, not
        # external_reversible -- policy.yaml pins consequential to always_human
        # and broker.HARD_HUMAN_CLASSES hard-blocks it in code.
        action_class: consequential

  # ------------------------------------------------------- google workspace --
  # The Google Workspace connectors share one refresh-token credential set. auth is the
  # pinned "oauth2:REFRESH_TOKEN_ENV:CLIENT_ID_ENV:CLIENT_SECRET_ENV" scheme: the
  # broker exchanges the refresh token for a short-lived access token and sets
  # an authorization header carrying it on the outbound request -- it never
  # hands the refresh token or the access token to an agent subprocess. The
  # `google` group is deliberately NOT in broker.INJECTABLE_GROUPS (== {"ai"}),
  # so none of this env is ever injected into an agent process even for a read
  # grant.

  # Per-account variants: clone as `gmail_<acct>` and point the REFRESH env at
  # `GOOGLE_OAUTH_REFRESH_TOKEN_<ACCT>`. The OAuth token cache keys by env NAME,
  # so account-specific refresh tokens cannot collide.
  gmail:
    label: "Gmail"
    group: google
    env: [GOOGLE_OAUTH_REFRESH_TOKEN, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET]
    capabilities:
      gmail.search:
        label: "Search messages and threads"
        action_class: read_only
        # Ambiguous: Gmail "search" only returns list message/thread IDs -- reading actual email bodies requires gmail.get_message.
        input_examples:
          - "GET /gmail/v1/users/me/messages?q=from:stripe — Search and retrieve message IDs of Stripe emails"
          - "GET /gmail/v1/users/me/threads?q=subject:invoice — Search thread IDs matching a subject line"
        # Gmail search rides the q query parameter on these GET collections.
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/(messages|threads)$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail.get_message:
        label: "Read a message or message attachment"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/messages/[A-Za-z0-9_-]+(/attachments/[A-Za-z0-9_-]+)?$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail.get_thread:
        label: "Read a thread"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/threads/[A-Za-z0-9_-]+$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      # TN.6 — outbound send. CONSEQUENTIAL: requires human approval OR a live
      # campaign grant (TN.7). Never injectable; broker-proxied only.
      gmail.send:
        label: "Send an email (users.messages.send)"
        action_class: consequential
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [POST]
          path_regex: '^/gmail/v1/users/me/messages/send$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"

  # Second Gmail account (example-org@example.com) — the per-account variant pattern.
  # Same client, but the REFRESH env is suffixed so the oauth cache keys distinctly.
  gmail_ownera:
    label: "Gmail — example-org@example.com"
    group: google
    env: [GOOGLE_OAUTH_REFRESH_TOKEN_OWNERA, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET]
    capabilities:
      gmail_ownera.search:
        label: "Search messages and threads"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/(messages|threads)$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_OWNERA:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail_ownera.get_message:
        label: "Read a message or message attachment"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/messages/[A-Za-z0-9_-]+(/attachments/[A-Za-z0-9_-]+)?$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_OWNERA:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail_ownera.get_thread:
        label: "Read a thread"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/threads/[A-Za-z0-9_-]+$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_OWNERA:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      # Outbound reply. CONSEQUENTIAL: human approval OR a live campaign grant, same as
      # gmail.send. Requires the refresh token to be minted with the gmail.send scope.
      gmail_ownera.send:
        label: "Send an email (users.messages.send)"
        action_class: consequential
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [POST]
          path_regex: '^/gmail/v1/users/me/messages/send$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_OWNERA:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"

  # Third Gmail account (owner@initech.example) — same per-account variant pattern.
  gmail_initech:
    label: "Gmail — owner@initech.example"
    group: google
    env: [GOOGLE_OAUTH_REFRESH_TOKEN_INITECH, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET]
    capabilities:
      gmail_initech.search:
        label: "Search messages and threads"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/(messages|threads)$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_INITECH:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail_initech.get_message:
        label: "Read a message or message attachment"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/messages/[A-Za-z0-9_-]+(/attachments/[A-Za-z0-9_-]+)?$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_INITECH:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail_initech.get_thread:
        label: "Read a thread"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/threads/[A-Za-z0-9_-]+$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_INITECH:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      # Outbound reply. CONSEQUENTIAL: human approval OR a live campaign grant, same as
      # gmail.send. Requires the refresh token to be minted with the gmail.send scope.
      # NB: the W2 loop historically quarantined @initech.example outbound — sends stay
      # approval-gated here regardless.
      gmail_initech.send:
        label: "Send an email (users.messages.send)"
        action_class: consequential
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [POST]
          path_regex: '^/gmail/v1/users/me/messages/send$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_INITECH:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"

  # Fourth Gmail account (owner@acmeuni.example) — same per-account variant.
  gmail_acmeuni:
    label: "Gmail — owner@acmeuni.example"
    group: google
    env: [GOOGLE_OAUTH_REFRESH_TOKEN_ACMEUNI, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET]
    capabilities:
      gmail_acmeuni.search:
        label: "Search messages and threads"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/(messages|threads)$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_ACMEUNI:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail_acmeuni.get_message:
        label: "Read a message or message attachment"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/messages/[A-Za-z0-9_-]+(/attachments/[A-Za-z0-9_-]+)?$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_ACMEUNI:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      gmail_acmeuni.get_thread:
        label: "Read a thread"
        action_class: read_only
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [GET]
          path_regex: '^/gmail/v1/users/me/threads/[A-Za-z0-9_-]+$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_ACMEUNI:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      # Outbound reply. CONSEQUENTIAL: human approval OR a live campaign grant, same as
      # gmail.send. Requires the refresh token to be minted with the gmail.send scope.
      gmail_acmeuni.send:
        label: "Send an email (users.messages.send)"
        action_class: consequential
        http:
          base_url: "https://gmail.googleapis.com"
          methods: [POST]
          path_regex: '^/gmail/v1/users/me/messages/send$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_ACMEUNI:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"


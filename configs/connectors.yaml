          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN_HOOLI:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"

  google_sheets:
    label: "Google Sheets"
    group: google
    env: [GOOGLE_OAUTH_REFRESH_TOKEN, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET]
    capabilities:
      google_sheets.read:
        label: "Read spreadsheet metadata and cell values"
        action_class: read_only
        # GET-only: spreadsheet metadata, values.get, and values.batchGet.
        http:
          base_url: "https://sheets.googleapis.com"
          methods: [GET]
          path_regex: '^/v4/spreadsheets/[A-Za-z0-9_-]+(/values/.+|/values:batchGet.*)?$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      google_sheets.write:
        label: "Overwrite a range's values"
        action_class: external_reversible
        # Ambiguous: PUT to values.update on ONE range only -- deliberately NOT batchUpdate, which could restructure columns/rows/tabs.
        input_examples:
          - "PUT /v4/spreadsheets/sheet123/values/Sheet1!A1:B10 — Overwrite a specific grid region with cell values"
          - "PUT /v4/spreadsheets/sheet456/values/Sheet1!C5 — Set a single cell's value in a spreadsheet"
        # PUT to values.update on exactly one range -- NOT values:batchUpdate,
        # which can restructure the sheet (add/delete rows, columns, tabs).
        http:
          base_url: "https://sheets.googleapis.com"
          methods: [PUT]
          path_regex: '^/v4/spreadsheets/[A-Za-z0-9_-]+/values/[^/]+$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"
      google_sheets.append:
        label: "Append rows to a range"
        action_class: external_reversible
        http:
          base_url: "https://sheets.googleapis.com"
          methods: [POST]
          path_regex: '^/v4/spreadsheets/[A-Za-z0-9_-]+/values/[^/]+:append$'
          auth: "oauth2:GOOGLE_OAUTH_REFRESH_TOKEN:GOOGLE_OAUTH_CLIENT_ID:GOOGLE_OAUTH_CLIENT_SECRET"


# OmniAgentOS connector registry.
#
# Every external system an agent may touch is declared here. This file contains
# NO SECRETS -- only the *names* of environment variables that the credential
# broker (omniagentos/connectors/broker.py) resolves at call time. Agents receive
# capabilities, never credentials.
#
# Each capability declares an ActionClass (contracts.py:132). The class -- not the
# connector -- decides whether a call runs unattended, parks for approval, or is
# refused outright:
#
#   read_only            -> auto. Never mutates anything.
#   sandboxed_creation   -> auto. Produces artifacts in the run workspace only.
#   internal_reversible  -> auto-write. Mutates our own systems; trivially undone.
#   external_reversible  -> APPROVAL. A human/customer sees it; undoable with effort.
#   consequential        -> ALWAYS HUMAN. Moves money, spends budget, or can destroy
#                           data/infrastructure. policy.yaml pins always_human: true,
#                           and broker.py additionally hard-blocks these in code so
#                           that no config edit can ever promote them into the auto
#                           tier. Both gates must be removed by hand to change this.
#
# Adding a connector: give every write capability the HIGHEST class you can defend.
# The registry is a denylist of last resort, not a wish list.

version: 1

groups:
  payments:   { label: "Payments & banking", danger: true }
  ads:        { label: "Advertising",        danger: true }
  crm:        { label: "CRM & customers",    danger: false }
  comms:      { label: "Communications",     danger: false }
  analytics:  { label: "Analytics & experimentation", danger: false }
  ai:         { label: "AI & media generation", danger: false }
  infra:      { label: "Infrastructure",     danger: true }
  monitoring: { label: "Monitoring",         danger: false }
  knowledge:   { label: "Knowledge base",     danger: false }
  google:     { label: "Google Workspace",   danger: false }

connectors:

  # ------------------------------------------------------------- first light --
  # Credential-free, network-free proof of the capability lifecycle.  The
  # broker recognizes the reviewed inprocess:// scheme and dispatches this one
  # exact capability to omniagentos.provision.connectors.echo.  There is no
  # env: name because Echo never resolves a credential.
  echo:
    label: "Echo — capability first light"
    group: monitoring
    env: []
    capabilities:
      echo.ping:
        label: "Validate and echo a bounded ping payload"
        action_class: read_only
        http:
          base_url: "inprocess://echo"
          methods: [POST]
          path_prefixes: [/ping]
          path_regex: "^/ping$"

  knowledge:
    label: "OmniAgentOS knowledge base"
    group: knowledge
    env: []
    capabilities:
      knowledge.read:
        label: "Read active knowledge facts and graph"
        action_class: read_only
      knowledge.write:
        label: "Ingest web and chat knowledge into quarantine"
        action_class: internal_reversible

  # ---------------------------------------------------------------- payments --
  # Reads are freely grantable. Every write here is consequential: these
  # credentials can move real money out of real accounts.

  stripe_acmeuni:
    label: "Stripe — AcmeUni"
    group: payments
    env:
      - ACMEUNI_STRIPE_PRIMARY_SECRET_KEY
      - ACMEUNI_STRIPE_SECONDARY_SECRET_KEY
    capabilities:
      stripe_acmeuni.read:
        label: "Read charges, customers, subscriptions, payouts"
        action_class: read_only
        # GET-only, and only on read paths. This allowlist -- NOT the credential --
        # is what makes this capability read-only: the same secret key could refund.
        # /v1/refunds is deliberately absent from path_prefixes.
        http:
          base_url: "https://api.stripe.com"
          methods: [GET]
          path_prefixes:
            - /v1/charges
            - /v1/customers
            - /v1/subscriptions
            - /v1/payment_intents
            - /v1/balance
            - /v1/payouts
            - /v1/invoices
          auth: "bearer:ACMEUNI_STRIPE_PRIMARY_SECRET_KEY"
      stripe_acmeuni.refund:
        label: "Issue a refund"
        action_class: consequential
      stripe_acmeuni.charge:
        label: "Create a charge or subscription"
        action_class: consequential

  stripe_initech:
    label: "Stripe — Initech"
    group: payments
    env:
      - INITECH_STRIPE_PRIMARY_SECRET_KEY
    capabilities:
      stripe_initech.read:
        label: "Read charges, customers, subscriptions, payouts"
        action_class: read_only
        # GET-only, read paths only — mirrors stripe_acmeuni.read. This allowlist,
        # NOT the credential, is what makes the Initech key read-only: the same
        # secret could refund. /v1/refunds is deliberately absent. Reviewed for the
        # revenue/P&L collector (revenue_facts, vertical=Initech, source=stripe).
        http:
          base_url: "https://api.stripe.com"
          methods: [GET]
          path_prefixes:
            - /v1/charges
            - /v1/customers
            - /v1/subscriptions
            - /v1/payment_intents
            - /v1/balance
            - /v1/balance_transactions
            - /v1/payouts
            - /v1/invoices
          auth: "bearer:INITECH_STRIPE_PRIMARY_SECRET_KEY"
      stripe_initech.refund:
        label: "Issue a refund"
        action_class: consequential
      stripe_initech.charge:
        label: "Create a charge or subscription"
        action_class: consequential

  # These accounts are global payment rails, not tied to an individual brand.
  # Keep them separate because each key selects a distinct Stripe account.
  stripe_primary:
    label: "Stripe — global primary account"
    group: payments
    env:
      - STRIPE_PRIMARY_SECRET_KEY
    capabilities:
      stripe_primary.read:
        label: "Read global primary-account charges"
        action_class: read_only
        http:
          base_url: "https://api.stripe.com"
          methods: [GET]
          path_prefixes:
            - /v1/charges
            - /v1/balance_transactions
          auth: "bearer:STRIPE_PRIMARY_SECRET_KEY"

  stripe_secondary:
    label: "Stripe — global secondary account"
    group: payments
    env:
      - STRIPE_SECONDARY_SECRET_KEY
    capabilities:
      stripe_secondary.read:
        label: "Read global secondary-account charges"
        action_class: read_only
        http:
          base_url: "https://api.stripe.com"
          methods: [GET]
          path_prefixes:
            - /v1/charges
            - /v1/balance_transactions
          auth: "bearer:STRIPE_SECONDARY_SECRET_KEY"

  slash_bank:
    label: "Slash — business banking (charge card + cash)"
    group: payments
    env:
      - SLASH_API_KEY
      - SLASH_API_KEY_ACMEUNI
      - SLASH_API_KEY_INITECH
    capabilities:
      slash_bank.read:
        label: "Read accounts, balances, transactions"
        action_class: read_only
        # GET-only. /card is deliberately absent from path_prefixes -- card
        # endpoints can expose PANs, and no agent needs them to do reporting.
        # Slash rejects bearer-token auth; it wants a bare X-Api-Key header (the
        # "header:" scheme). Cursor pagination via ?cursor=, no limit param.
        http:
          base_url: "https://api.joinslash.com"
          methods: [GET]
          path_prefixes:
            - /account
            - /transaction
            - /balance
          auth: "header:X-Api-Key:SLASH_API_KEY"
      # Per-brand Slash accounts. The operator runs separate Slash keys per brand;
      # each is a distinct account/org, so each gets its own read capability keyed
      # to its own X-Api-Key env. Same GET-only allowlist as slash_bank.read (no
      # /card). Reviewed for the Cash / banking collector (bank_facts, provider=slash).
      slash_bank.read_acmeuni:
        label: "Read AcmeUni Slash accounts, balances, transactions"
        action_class: read_only
        http:
          base_url: "https://api.joinslash.com"
          methods: [GET]
          path_prefixes:
            - /account
            - /transaction
            - /balance
          auth: "header:X-Api-Key:SLASH_API_KEY_ACMEUNI"
      slash_bank.read_initech:
        label: "Read Initech Slash accounts, balances, transactions"
        action_class: read_only
        http:
          base_url: "https://api.joinslash.com"
          methods: [GET]
          path_prefixes:
            - /account
            - /transaction
            - /balance
          auth: "header:X-Api-Key:SLASH_API_KEY_INITECH"
      slash_bank.transfer:
        label: "Move money out of Slash (transfer / payment / recipient)"
        action_class: consequential

  paypal:
    label: "PayPal"
    group: payments
    env:
      - PAYPAL_READONLY_CLIENT_ID
      - PAYPAL_READONLY_CLIENT_SECRET
      - PAYPAL_WRITE_CLIENT_ID
      - PAYPAL_WRITE_CLIENT_SECRET
    capabilities:
      paypal.read:
        label: "Read transactions and balances (uses the read-only client)"
        action_class: read_only
      paypal.refund:
        label: "Refund a transaction (uses the write client)"
        action_class: consequential
      paypal.payout:
        label: "Send a payout"
        action_class: consequential

  paypal_claude:
    label: "PayPal — Agent Pro Academy"
    group: payments
    env:
      - PAYPAL_CLAUDE_CLIENT_ID
      - PAYPAL_CLAUDE_CLIENT_SECRET
      - PAYPAL_CLAUDE_ENV
    capabilities:
      paypal_claude.read:
        label: "Read transactions and balances"
        action_class: read_only
      paypal_claude.refund:
        label: "Refund a transaction"
        action_class: consequential
      paypal_claude.payout:
        label: "Send a payout"
        action_class: consequential

  nmi_fortpoint:
    label: "NMI — Fortpoint gateway"
    group: payments
    env:
      - FORTPOINT_NMI_SECURITY_KEY
      - FORTPOINT_NMI_USERNAME
      - FORTPOINT_NMI_API_BASE
    capabilities:
      nmi_fortpoint.read:
        label: "Query transactions"
        action_class: read_only
        # NMI's *query* API is POST-only but cannot move money. The exact route is
        # pinned in both the registry and broker; transact.php is unreachable.
        http:
          base_url: "https://secure.nmi.com"
          methods: [POST]
          path_prefixes: [/api/query.php]
          path_regex: "^/api/query\\.php$"
          auth: "form:security_key:FORTPOINT_NMI_SECURITY_KEY"
      nmi_fortpoint.refund:
        label: "Refund or void a transaction"
        action_class: consequential

  nmi_glacier:
    label: "NMI — Glacier gateway"
    group: payments
    env:
      - GLACIER_NMI_SECURITY_KEY
      - GLACIER_NMI_USERNAME
      - GLACIER_NMI_API_BASE
    capabilities:
      nmi_glacier.read:
        label: "Query transactions"
        action_class: read_only
        # Query-only route; never permit NMI's transact.php endpoint here.
        http:
          base_url: "https://secure.nmi.com"
          methods: [POST]
          path_prefixes: [/api/query.php]
          path_regex: "^/api/query\\.php$"
          auth: "form:security_key:GLACIER_NMI_SECURITY_KEY"
      nmi_glacier.refund:
        label: "Refund or void a transaction"
        action_class: consequential

  chargeblast:
    label: "ChargeBlast (chargeback alerts)"
    group: payments
    env:
      - ACMEUNI_CHARGEBLAST_PRIMARY_API_KEY
      - ACMEUNI_CHARGEBLAST_SECONDARY_API_KEY
      - INITECH_CHARGEBLAST_API_KEY
    capabilities:
      chargeblast.read:
        label: "Read chargeback and dispute alerts"
        action_class: read_only
      chargeblast.refund:
        label: "Pre-emptively refund an alerted transaction"
        # NOTE: the stack has CHARGEBLAST_AUTO_REFUND_ENABLED. That is a *service*
        # setting and is deliberately NOT reachable as an agent capability. An agent
        # refunding on its own recognisance is exactly the failure this tier exists
        # to prevent.
        action_class: consequential

  vandelay:
    label: "Vandelay"
    group: payments
    env:
      - VANDELAY_LOGIN_ID
      - VANDELAY_PASSWORD
      - VANDELAY_BASE_URL
    capabilities:
      vandelay.read:
        label: "Read orders, transactions, rebill schedules"
        action_class: read_only
      vandelay.refund:
        label: "Refund or cancel an order"
        action_class: consequential
      vandelay.rebill_edit:
        label: "Change a customer's rebill schedule"
        action_class: consequential

  fanbasis:
    label: "FanBasis"
    group: payments
    env:
      - FANBASIS_API_KEY
    capabilities:
      fanbasis.read:
        label: "Read payments and payouts"
        action_class: read_only
        # FanBasis documents its API behind an authenticated portal. These are the
        # only harmless collection paths the revenue collector may probe.
        http:
          base_url: "https://api.fanbasis.com"
          methods: [GET]
          path_prefixes:
            - /v1/transactions
            - /v1/orders
            - /v1/payouts
          auth: "bearer:FANBASIS_API_KEY"

  teller:
    label: "Teller (bank accounts)"
    group: payments
    env:
      - TELLER_APPLICATION_ID
      - TELLER_CERT_PATH
      - TELLER_CERT_KEY_PATH
      - TELLER_ENV
      - TELLER_ACCESS_TOKEN
      - TELLER_API_BASE
    capabilities:
      teller.read:
        label: "Read bank balances and transactions"
        action_class: read_only
        # GET-only on Teller's read surface (accounts, per-account balances and
        # transactions). Teller authenticates with mutual-TLS client cert
        # (TELLER_CERT_PATH + TELLER_CERT_KEY_PATH) plus HTTP Basic auth using
        # TELLER_ACCESS_TOKEN as the username with an empty password. The broker's
        # "mtls" auth scheme handles both. Reviewed for the Cash / banking
        # collector.
        http:
          base_url: "https://api.teller.io"
          methods: [GET]
          path_regex: '^/accounts$|^/accounts/[^/]+/balances$|^/accounts/[^/]+/transactions$'
          auth: "mtls:TELLER_CERT_PATH:TELLER_CERT_KEY_PATH:TELLER_ACCESS_TOKEN"
      # No transfer/payment capability is declared. Teller is read-only by design
      # and there is no agent-reachable path to move funds out of a bank account.

  # Per-bank Teller variants. Each Teller enrollment token is scoped to ONE
  # institution's login, so Chase and Bank of America each get their own read
  # capability keyed to their own access token. Same mTLS scheme, same GET-only
  # read surface as teller.read; no transfer capability. Tokens were enrolled via
  # the CRM (Teller app app_0000000000000000000000, development env) and reused here.
  teller_chase:
    label: "Teller — Chase (business checking)"
    group: payments
    env: [TELLER_APPLICATION_ID, TELLER_CERT_PATH, TELLER_CERT_KEY_PATH, TELLER_ENV, TELLER_ACCESS_TOKEN_CHASE, TELLER_API_BASE]
    capabilities:
      teller_chase.read:
        label: "Read Chase balances and transactions"
        action_class: read_only
        http:
          base_url: "https://api.teller.io"
          methods: [GET]
          path_regex: '^/accounts$|^/accounts/[^/]+/balances$|^/accounts/[^/]+/transactions$'
          auth: "mtls:TELLER_CERT_PATH:TELLER_CERT_KEY_PATH:TELLER_ACCESS_TOKEN_CHASE"

  teller_bank_of_america:
    label: "Teller — Bank of America (business checking)"
    group: payments
    env: [TELLER_APPLICATION_ID, TELLER_CERT_PATH, TELLER_CERT_KEY_PATH, TELLER_ENV, TELLER_ACCESS_TOKEN_BANK_OF_AMERICA, TELLER_API_BASE]
    capabilities:
      teller_bank_of_america.read:
        label: "Read Bank of America balances and transactions"
        action_class: read_only
        http:
          base_url: "https://api.teller.io"
          methods: [GET]
          path_regex: '^/accounts$|^/accounts/[^/]+/balances$|^/accounts/[^/]+/transactions$'
          auth: "mtls:TELLER_CERT_PATH:TELLER_CERT_KEY_PATH:TELLER_ACCESS_TOKEN_BANK_OF_AMERICA"

  slash:
    label: "Slash (banking / cards)"
    group: payments
    env:
      - SLASH_API_KEY
    capabilities:
      slash.read:
        label: "Read account balances and card transactions"
        action_class: read_only

  # -------------------------------------------------------------------- ads --
  # Reads and analysis are free. Anything that can change what is *spent* is
  # consequential -- an agent in a loop with a budget key is an unbounded burn.

  meta_acmeuni:
    label: "Meta Ads — AcmeUni"
    group: ads
    env:
      - ACMEUNI_META_ACCESS_TOKEN
      - ACMEUNI_META_AD_ACCOUNT_IDS
    capabilities:
      meta_acmeuni.read:
        label: "Read campaigns, ad sets, ads, insights, spend"
        action_class: read_only
        # Ambiguous: GET-only Graph API access -- read-only access prevents mutating live campaigns or budgets (which are POSTs).
        input_examples:
          - "GET /act_123456/campaigns — Fetch marketing campaigns for a Facebook ad account"
          - "GET /act_123456/insights — Retrieve campaign performance and spend insights"
        # GET-only on the Graph API. Meta mutations are POSTs, so refusing every
        # non-GET method is what keeps a "read" grant from touching a live budget.
        http:
          base_url: "https://graph.facebook.com/v21.0"
          methods: [GET]
          path_prefixes: ["/act_", "/"]
          auth: "query:access_token:ACMEUNI_META_ACCESS_TOKEN"
      meta_acmeuni.analyze:
        label: "Produce optimisation recommendations (writes nothing to Meta)"
        action_class: sandboxed_creation
      meta_acmeuni.creative_draft:
        label: "Upload a PAUSED creative or draft ad"
        action_class: internal_reversible
      meta_acmeuni.budget_change:
        label: "Change a campaign or ad set budget"
        action_class: consequential
      meta_acmeuni.launch:
        label: "Launch, unpause, or activate an ad"
        action_class: consequential

  meta_initech:
    label: "Meta Ads — Initech"
    group: ads
    env:
      - INITECH_META_ACCESS_TOKEN
      - INITECH_META_AD_ACCOUNT_IDS
    capabilities:
      meta_initech.read:
        label: "Read campaigns, ad sets, ads, insights, spend"
        action_class: read_only
        # GET-only on the Graph API — mirrors meta_acmeuni.read. Meta mutations are
        # POSTs, so refusing every non-GET method keeps this "read" grant off a
        # live budget. Reviewed for the revenue/P&L collector (per-campaign
        # insights, vertical=Initech, source=meta).
        http:
          base_url: "https://graph.facebook.com/v21.0"
          methods: [GET]
          path_prefixes: ["/act_", "/"]
          auth: "query:access_token:INITECH_META_ACCESS_TOKEN"
      meta_initech.analyze:
        label: "Produce optimisation recommendations (writes nothing to Meta)"
        action_class: sandboxed_creation
      meta_initech.creative_draft:
        label: "Upload a PAUSED creative or draft ad"
        action_class: internal_reversible
      meta_initech.budget_change:
        label: "Change a campaign or ad set budget"
        action_class: consequential
      meta_initech.launch:
        label: "Launch, unpause, or activate an ad"
        action_class: consequential

  meta_globex:
    label: "Meta Ads — Globex"
    group: ads
    env:
      - GLOBEX_META_ACCESS_TOKEN
      - GLOBEX_META_AD_ACCOUNT_ID
      - GLOBEX_META_APP_ID
      - GLOBEX_META_APP_SECRET
      - GLOBEX_META_BM_ID
      - GLOBEX_META_PAGE_ID
      - GLOBEX_META_PIXEL_ID
    capabilities:
      meta_globex.read:
        label: "Read campaigns, ad sets, ads, insights, spend"
        action_class: read_only
      meta_globex.analyze:
        label: "Produce optimisation recommendations (writes nothing to Meta)"
        action_class: sandboxed_creation
      meta_globex.creative_draft:
        label: "Upload a PAUSED creative or draft ad"
        action_class: internal_reversible
      meta_globex.budget_change:
        label: "Change a campaign or ad set budget"
        action_class: consequential
      meta_globex.launch:
        label: "Launch, unpause, or activate an ad"
        action_class: consequential

  meta_agentpro:
    label: "Meta Ads — Agent Pro Academy"
    group: ads
    env:
      - ACMEUNI_AGENTPRO_META_ACCESS_TOKEN
      - ACMEUNI_AGENTPRO_META_PIXEL_ID
    capabilities:
      meta_agentpro.read:
        label: "Read campaigns, ad sets, ads, insights, spend"
        action_class: read_only
      meta_agentpro.analyze:
        label: "Produce optimisation recommendations (writes nothing to Meta)"
        action_class: sandboxed_creation
      meta_agentpro.creative_draft:
        label: "Upload a PAUSED creative or draft ad"
        action_class: internal_reversible
      meta_agentpro.budget_change:
        label: "Change a campaign or ad set budget"
        action_class: consequential
      meta_agentpro.launch:
        label: "Launch, unpause, or activate an ad"
        action_class: consequential

  metapi:
    label: "MetAPI (competitor ad intelligence)"
    group: ads
    env:
      - METAPI_API_KEY
      - METAPI_BASE_URL
    capabilities:
      metapi.read:
        label: "Read competitor ad libraries"
        action_class: read_only

  # TN.9 — local-only Studio on 127.0.0.1:4700 (Grok product).
  # external_reversible: local media gen under full-auto; still broker-audited.
  # Paid ad launch / spend stays on meta_* consequential + HARD_HUMAN.
  globex:
    label: "Globex Studio (local media generation)"
    group: ai
    env: []
    capabilities:
      globex.generate_image:
        label: "Generate image via Globex Studio"
        action_class: external_reversible
        http:
          base_url: "http://127.0.0.1:4700"
          methods: [POST]
          path_regex: '^/v1/generate/(image|images)$'
      globex.generate_video:
        label: "Generate video via Globex Studio"
        action_class: external_reversible
        http:
          base_url: "http://127.0.0.1:4700"
          methods: [POST]
          path_regex: '^/v1/generate/(video|videos)$'

  # ------------------------------------------------------------------- crm --
  # The auto-write tier lives here. Notes and tags are internal, reversible, and
  # invisible to the customer. Anything the customer *sees* needs approval.

  piedpiper_acmeuni:
    label: "PiedPiper — AcmeUni"
    group: crm
    env:
      - PIEDPIPER_ACMEUNI_TOKEN
      - PIEDPIPER_ACMEUNI_LOCATION_ID
      - PIEDPIPER_COMPANY_ID
    capabilities:
      piedpiper_acmeuni.read:
        label: "Read contacts, opportunities, pipelines, conversations"
        action_class: read_only
        http:
          base_url: "https://services.leadconnectorhq.com"
          methods: [GET]
          path_prefixes:
            - /contacts
            - /opportunities
            - /pipelines
            - /conversations
            - /calendars
          auth: "bearer:PIEDPIPER_ACMEUNI_TOKEN"
          headers: { Version: "2021-07-28" }
      piedpiper_acmeuni.note_write:
        label: "Add an internal note to a contact"
        action_class: internal_reversible
        # An auto-write, so its scope is pinned exactly. path_regex confines it to
        # the /notes subresource of one contact: a POST to /contacts/{id} itself
        # (which edits customer-visible fields) is NOT reachable here -- that is
        # piedpiper_acmeuni.contact_edit, external_reversible, which parks for approval.
        # The regex, not the prefix, is what carries that guarantee.
        http:
          base_url: "https://services.leadconnectorhq.com"
          methods: [POST]
          path_prefixes: [/contacts/]
          path_regex: '^/contacts/[A-Za-z0-9_-]+/notes/?$'
          auth: "bearer:PIEDPIPER_ACMEUNI_TOKEN"
          headers: { Version: "2021-07-28" }
      piedpiper_acmeuni.tag_write:
        label: "Add or remove a contact tag"
        action_class: internal_reversible
        http:
          base_url: "https://services.leadconnectorhq.com"
          methods: [POST, DELETE]
          path_prefixes: [/contacts/]
          path_regex: '^/contacts/[A-Za-z0-9_-]+/tags(/[A-Za-z0-9_-]+)?$'
          auth: "bearer:PIEDPIPER_ACMEUNI_TOKEN"
          headers: { Version: "2021-07-28" }
      piedpiper_acmeuni.opportunity_move:
        label: "Move an opportunity between pipeline stages"
        action_class: internal_reversible
        http:
          base_url: "https://services.leadconnectorhq.com"
          methods: [PUT]
          path_prefixes: [/opportunities/]
          path_regex: '^/opportunities/[A-Za-z0-9_-]+/status/?$'
          auth: "bearer:PIEDPIPER_ACMEUNI_TOKEN"
          headers: { Version: "2021-07-28" }
      piedpiper_acmeuni.contact_edit:
        label: "Edit customer-visible contact fields"
        action_class: external_reversible

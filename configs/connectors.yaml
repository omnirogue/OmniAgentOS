    capabilities:
      huggingface.generate:
        label: "Run inference against a hosted model"
        action_class: sandboxed_creation

  elevenlabs:
    label: "ElevenLabs (voice)"
    group: ai
    env: [ELEVENLABS_API_KEY, ELEVENLABS_API_KEY_WEBINAR, ELEVENLABS_VOICE_ID_OWNER, ELEVENLABS_VOICE_ID_OWNERA_PRO]
    capabilities:
      elevenlabs.generate:
        label: "Generate speech audio"
        action_class: sandboxed_creation
      elevenlabs.tts:
        label: "Text-to-speech (ElevenLabs)"
        action_class: sandboxed_creation
        http:
          base_url: "https://api.elevenlabs.io"
          methods: [GET, POST]
          path_prefixes:
            - /v1/voices
            - /v1/text-to-speech
          # Pin GET voices list + POST synthesize to one voice id.
          path_regex: '^/v1/(voices/?|text-to-speech/[A-Za-z0-9_-]+/?)$'
          auth: "header:xi-api-key:ELEVENLABS_API_KEY"

  # xAI voice: no verified public REST TTS surface at build time — probe-driven via steward.yaml xai_candidates
  xai_voice:
    label: "xAI voice (probe-driven TTS)"
    group: ai
    env: [XAI_API_KEY]
    capabilities:
      xai_voice.tts:
        label: "Text-to-speech (xAI, config-probed)"
        action_class: sandboxed_creation

  replicate:
    label: "Replicate"
    group: ai
    env: [REPLICATE_API_TOKEN]
    capabilities:
      replicate.generate:
        label: "Run an image/video model"
        action_class: sandboxed_creation
        http:
          base_url: "https://api.replicate.com/v1"
          methods: [GET, POST]
          # Exactly two routes, pinned by regex rather than prefix: create ONE
          # prediction for a named model, and read ONE prediction back by id.
          # A prefix would admit POST /models/<x>/<y>/anything; the loop seam
          # additionally restricts <owner>/<model> to a reviewed allowlist
          # (loop_effects.REPLICATE_MODELS), because a model id is code we pay
          # to run.  No DELETE and no /trainings: cancel and train are not
          # sandboxed creation.
          path_regex: '^/(models/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/predictions|predictions/[A-Za-z0-9_-]+)/?$'
          auth: "bearer:REPLICATE_API_TOKEN"
          headers:
            # Block for the prediction instead of polling from tick zero. Still
            # bounded upstream (Replicate caps the wait) and still polled by the
            # caller when it comes back unfinished.
            Prefer: "wait"

  higgsfield:

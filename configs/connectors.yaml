  # ---------------------------------------------------------------- jira --
  # JG-1 read-only client. Writes (transition/create/comment) land in JG-5
  # behind OMNIAGENTOS_JIRA_WRITES=0. Live site: example-team.atlassian.net
  # (G-A3). Project keys: ACM·CA·INI·HOO·OAOS (G-A2).
  jira:
    label: "Jira Cloud (example-team)"
    group: crm
    env:
      - JIRA_EMAIL
      - JIRA_API_TOKEN
      - JIRA_BASE_URL
    capabilities:
      jira.read:
        label: "Read projects, issues, statuses, users, and JQL search"
        action_class: read_only
        # GET-only: methods: [GET] refuses every POST (create, transition, comment,
        # and even read-shaped search POST). Search uses GET /rest/api/3/search/jql
        # (spec §5.1). POST search/write surface is a post-P3-BROKER (JG-5) hand-off.
        http:
          base_url: "https://example-team.atlassian.net"
          methods: [GET]
          path_prefixes:
            - /rest/api/3/myself
            - /rest/api/3/project
            - /rest/api/3/issue
            - /rest/api/3/search/jql
            - /rest/api/3/user
          path_regex: '^/rest/api/3/(myself|project(/.*)?|issue(/[^/]+)?(/transitions)?|issue/bulkfetch|search/jql|user(/.*)?)$'
          auth: "basic:JIRA_EMAIL:JIRA_API_TOKEN"

  # ---------------------------------------------------------------- web --
  # U-N1: Web read connector — fetch and search with SSRF guard and bounds.
  #
  # COST CLASS DECISION (K2-14 BINDING):
  # - web.fetch: COMPLETELY FREE (paid=false). Cost model: zero per-query overhead,
  #   only bandwidth. Suitable for research workers on auto-grant floor.
  # - web.search: METERED (paid=true, floor-excluded). Requires external search API
  #   (Tavily, Brave-Search, Google Custom Search) with per-query charges ($0.01–0.05).
  #   Requires operator decision on budget envelope via D-08.
  #
  # SSRF GUARD: Refuses loopback/link-local/private/reserved hosts (169.254.169.254,
  # 127.0.0.0/8, 10.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, ::1, fe80::/10, fc00::/7).
  # Refuses non-http(s) schemes and URL userinfo. EVERY hop — the first and every
  # redirect target — is checked BEFORE the request is issued, and the connection is
  # then PINNED to the address that check validated (Host header + TLS sni_hostname
  # keep the real name), so no second DNS lookup can reach an unchecked address.
  #
  # AUTHORIZATION: both capabilities are store-backed only. web_read.fetch/search
  # refuse a caller-supplied `granted` list (caller_supplied_grant) and require
  # grant_store + grant_holder, so neither can vouch for itself.
  #
  # BOUNDS: 1 MB response cap (truncated, not refused), 10s timeout, 5 hops redirects.
  # All responses routed through sanitize_for_persistence before storage.
  #
  # IMPLEMENTATION: omniagentos/connectors/web_read.py (brokered fetch + Tavily search).
  # RUNTIME CALLER: omniagentos/scheduler/loop_effects.py (web.fetch parent-side seam).
  # TEST: tests/connectors/test_web_read.py (fixture + all counterfeits).
  web:
    label: "Web (bounded fetch and search)"
    group: ai
    env: [TAVILY_API_KEY]
    capabilities:
      web.fetch:
        label: "Fetch web content with SSRF guard and bounds"
        action_class: read_only
        # K2-14: Completely free; no search vendor; included on auto-grant floor.
        # Cost class: paid=false. Response truncated at 1 MB, timeout 10s, 5 redirects.
        # Free remote I/O still needs a durable intent + terminal audit pair.
        http:
          # Deliberately unreachable: web.fetch's target is chosen per call and is
          # governed by the SSRF guard, not by base_url. This host exists so the
          # capability is `callable_now` (a reviewed call path) and so any code that
          # tried to route web.fetch through broker.call's transport fails loudly
          # instead of silently reaching somewhere real.
          base_url: "https://web-fetch.invalid"
          # 2026-08-13 census (sha256:bda00c79): no production caller ever issues
          # POST through this seam. omniagentos/scheduler/loop_effects.py
          # (_run_web_fetch) is the sole runtime caller and only ever threads a
          # `url` arg -- its ArgSpec has no `method` field, so a loop worker
          # cannot even request POST. connectors/web_read.fetch()'s `method`
          # kwarg defaults to GET and is never passed "POST" by anything in
          # omniagentos/ or tests/. Fetch means read; GET-only matches
          # action_class: read_only above and the auto-write path_regex guard.
          methods: [GET]
          path_prefixes: [/]
      web.search:
        label: "Search the web through Tavily (metered provider)"
        action_class: read_only
        # K2-14: Tavily Search charges API credits per query.
        # Cost class: paid=true, floor-excluded. Needs operator budget decision via D-08.
        http:
          base_url: "https://api.tavily.com"
          # 2026-08-13 census (sha256:bda00c79): connectors/web_read.py::search()
          # is the sole caller-shape for this capability -- its broker_call always
          # uses method="POST", path="/search" (both literal, never dynamic), so
          # pinning to that exact path only matches what the code already does.
          # It currently has NO runtime seam wired into
          # loop_effects.py::CAPABILITIES (unlike web.fetch's _run_web_fetch);
          # only tests/connectors/test_web_read.py imports and exercises
          # search() directly. Genuinely POST-shaped (Tavily's search API), so
          # branch 2b: keep POST, pin path_regex rather than dropping the method.
          methods: [POST]
          path_prefixes: [/search]
          path_regex: "^/search$"
          auth: "bearer:TAVILY_API_KEY"

  artificial_analysis:
    label: "Artificial Analysis"
    group: ai
    env: [AA_API_KEY]
    capabilities:
      artificial_analysis.read:
        label: "Read public model intelligence benchmarks"
        action_class: read_only

  # LOCAL proxy on 127.0.0.1:8443 — LiteLLM translating Anthropic-format
  # /v1/messages requests to OpenRouter, giving agents OpenRouter's model
  # catalog (Kimi, DeepSeek, Qwen, Gemini, Llama, GPT, Grok) through an
  # Anthropic-compatible API under a $50/day HARD spend cap: the in-proxy
  # BudgetGuard returns 429 budget_exceeded at the cap, and a launchd watchdog
  # (spend-guard.sh, every 5 min) stops the proxy and writes a day tripwire
  # that start-proxy.sh refuses to start past. Loopback-only by design; never
  # rebind to 0.0.0.0. Clients authenticate with the proxy's OWN master key
  # (x-api-key, .master_key); OPENROUTER_API_KEY is sourced from the vault by
  # start-proxy.sh into the proxy host process only and never rides an agent
  # request. Ops home: ~/OmniAgentOS/Ops/litellm-openrouter (README).
  litellm_openrouter:
    label: "LiteLLM -> OpenRouter (local proxy)"
    group: ai
    env: [OPENROUTER_API_KEY]
    capabilities:
      litellm_openrouter.generate:
        label: "Chat/completion via the local Anthropic-format endpoint ($50/day cap)"
        action_class: sandboxed_creation
        # Local endpoint, no pinned auth scheme (same shape as globex):
        # the client credential is the proxy's .master_key file, not a vault
        # env var, so the broker never touches the OpenRouter key on this call.
        http:
          base_url: "https://127.0.0.1:8443"
          methods: [POST]
          path_prefixes: [/v1/messages]
          path_regex: '^/v1/messages$'
      litellm_openrouter.spend_read:
        label: "Read today's proxy spend, cap, and tripwire state"
        action_class: read_only
        # No http spec (callable_now stays false by design): spend truth is the
        # proxy's local ledger and tripwire files, read via spend-guard.sh —
        # not an HTTP surface.

  xai:
    label: "xAI (Grok)"
    group: ai
    env: [XAI_API_KEY]
    capabilities:
      xai.generate:
        label: "Generate text"
        action_class: sandboxed_creation

  google_ai:
    label: "Google AI"
    group: ai
    # GOOGLE_API_KEY is the name the OpenHands/LiteLLM adapter looks for
    # (harnesses/openhands/adapter.py); GEMINI_API_KEY and GOOGLE_AI_API_KEY are
    # the vault's actual current credential names for the same Gemini access.
    # Kept together since they authenticate the same provider.
    env: [GOOGLE_API_KEY, GEMINI_API_KEY, GOOGLE_AI_API_KEY]
    capabilities:
      google_ai.generate:
        label: "Generate text"
        action_class: sandboxed_creation

  moonshot:

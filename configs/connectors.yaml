  # NOTE: CRM_ADMIN_SERVICE_TOKEN / CRM_INTERNAL_SERVICE_TOKEN / CRM_BASIC_AUTH are
  # the CRM's actual vault credential names (the previous CRM_API_SECRET_KEY /
  # CRM_REPORTS_ADMIN_SERVICE_TOKEN names here did not exist in the vault -- fixed
  # so this connector resolves against real credentials). CRM_DATABASE_URL is a
  # separate, more dangerous credential (direct Postgres access to the CRM's own
  # database, distinct from the platform's own `postgres` connector) so its reads
  # and writes are declared as their own capabilities, mirroring the postgres
  # connector's read/write split. CRM_APP_URL, CRM_SSH_HOST, and
  # CRM_PG_TUNNEL_CMD are connection-routing config (a URL, a hostname, a shell
  # command), not credentials, and are intentionally not listed here.
  crm_internal:
    label: "Initech CRM (fb.initech.ai)"
    group: crm
    env:
      - CRM_ADMIN_SERVICE_TOKEN
      - CRM_INTERNAL_SERVICE_TOKEN
      - CRM_BASIC_AUTH
      - CRM_DATABASE_URL
    capabilities:
      crm_internal.read:
        label: "Read CRM reports, funnels, live sessions, and bank cash-flow"
        action_class: read_only
        # GET-only against the CRM's internal API. The cash-flow endpoints expose
        # the bank balances/transactions the CRM syncs from Teller (Chase/BofA etc.),
        # so OmniAgentOS reads bank data from the CRM (single source of truth) rather
        # than holding a second copy of the Teller enrollment tokens. Auth is the
        # CRM's own internal service-token header; POST paths (save/sync enrollment)
        # are unreachable because only GET is allowed.
        http:
          base_url: "https://fb.initech.ai"
          methods: [GET]
          path_prefixes:
            - /api/cash-flow
            - /api/reports
          auth: "header:x-internal-service-token:CRM_INTERNAL_SERVICE_TOKEN"
      crm_internal.annotate:
        label: "Write internal annotations and report notes"
        action_class: internal_reversible
      crm_internal.db_read:
        label: "Run read-only SELECT queries against the CRM database"
        action_class: read_only
        # Ambiguous: this is the CRM's OWN database (CRM_DATABASE_URL) -- a DIFFERENT
        # store from the platform's `postgres` connector, which sits two lines away in
        # the reader's mind and one grant away in the UI.
        # No http spec is pinned here, so callable_now is false. The examples therefore
        # describe the intended QUERY and deliberately do NOT name an HTTP route, which
        # would imply a reviewed call path that does not exist.
        input_examples:
          - "SELECT email FROM leads WHERE country = 'US' — no reviewed route yet"
          - "SELECT count(*) FROM sessions WHERE logged_in = 1 — read-only aggregate"
      crm_internal.db_write:
        label: "Run INSERT/UPDATE/DELETE/DDL against the CRM database"
        action_class: consequential


  # ---------------------------------------------------------------- infra --
  # Everything here can destroy or expose the business. Reads are grantable;
  # writes are consequential without exception.

  postgres:
    label: "Postgres (primary database)"
    group: infra
    env: [DATABASE_URL]
    capabilities:
      postgres.read:
        label: "Run read-only SELECT queries"
        action_class: read_only
      postgres.write:
        label: "Run INSERT/UPDATE/DELETE/DDL"
        action_class: consequential

  redis:
    label: "Redis"
    group: infra
    env: [REDIS_URL]
    capabilities:
      redis.read:
        label: "Read keys"
        action_class: read_only

  aws:
    label: "AWS (S3 / backups)"
    group: infra
    env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_BUCKET]
    capabilities:
      aws.s3_read:
        label: "Read objects from S3"
        action_class: read_only
      aws.s3_write:
        label: "Write objects to S3"
        action_class: internal_reversible
      aws.s3_delete:
        label: "Delete objects from S3 (backups live here)"
        action_class: consequential

  cloudflare:
    label: "Cloudflare (DNS / CDN)"
    group: infra
    env: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID, CLOUDFLARE_ACCOUNT_ID]
    capabilities:
      cloudflare.read:
        label: "Read DNS records and zone settings"
        action_class: read_only
        # GET-only zone/DNS inventory. Purge, rules, and settings writes stay
        # spec-less: this allowlist -- NOT the token -- is what makes it a read.
        http:
          base_url: "https://api.cloudflare.com"
          methods: [GET]
          path_prefixes:
            - /client/v4/zones
          auth: "bearer:CLOUDFLARE_API_TOKEN"
      cloudflare.dns_write:
        label: "Change DNS records (can take every site offline)"
        action_class: consequential
        # Pinned to the dns_records subresource only -- a valid human grant for a
        # DNS change must not be spendable on zone settings, rules, or purges.
        # consequential: policy.yaml pins always_human and broker.HARD_HUMAN_CLASSES
        # hard-blocks unattended calls in code; this spec only makes the APPROVED
        # path executable instead of dying at no_call_path.
        http:
          base_url: "https://api.cloudflare.com"
          methods: [POST, PUT, PATCH, DELETE]
          path_prefixes:
            - /client/v4/zones/
          path_regex: '^/client/v4/zones/[0-9a-f]+/dns_records(/[0-9a-f]+)?/?$'
          auth: "bearer:CLOUDFLARE_API_TOKEN"

  namecom:
    label: "Name.com (domain registrar)"
    group: infra
    env: [NAMECOM_API_USERNAME, NAMECOM_API_TOKEN]
    capabilities:
      namecom.read:
        label: "Read owned domains and their DNS records"
        action_class: read_only
        # GET-only. Availability/search is a read-shaped POST on this API and is
        # deliberately NOT folded in here (Customer.io precedent): read caps stay
        # structurally GET. The full-match regex excludes colon-verb subresources
        # -- GET /v4/domains/{domain}:getAuthCode returns the registrar transfer
        # authorization code, which is a secret, not an inventory read.
        http:
          base_url: "https://api.name.com"
          methods: [GET]
          path_prefixes:
            - /v4/domains
            - /v4/hello
          path_regex: '^/v4/(hello|domains(/[^/:]+(/records(/[0-9]+)?)?)?)/?$'
          auth: "basic:NAMECOM_API_USERNAME:NAMECOM_API_TOKEN"
      namecom.purchase:
        label: "Purchase a domain (spends real money)"
        action_class: consequential
        # Exactly the create-domain route, full-match. Renewals, transfers, and
        # everything else stay spec-less until individually reviewed.
        http:
          base_url: "https://api.name.com"
          methods: [POST]
          path_prefixes:
            - /v4/domains
          path_regex: '^/v4/domains$'
          auth: "basic:NAMECOM_API_USERNAME:NAMECOM_API_TOKEN"
      namecom.dns_write:
        label: "Change DNS records on an owned domain"
        # Same tier as cloudflare.dns_write for the same reason: a records change
        # can take a live site offline, so it rides the always-human rail.
        action_class: consequential
        http:
          base_url: "https://api.name.com"
          methods: [POST, PUT, DELETE]
          path_prefixes:
            - /v4/domains/
          path_regex: '^/v4/domains/[^/]+/records(/[0-9]+)?/?$'
          auth: "basic:NAMECOM_API_USERNAME:NAMECOM_API_TOKEN"

  vultr:
    label: "Vultr (VPS compute)"
    group: infra
    env: [VULTR_API_KEY]
    capabilities:
      vultr.read:
        label: "Read instances, plans, regions, and account balance"
        action_class: read_only
        # Full-match regex pins list + instance detail only. The bare prefix
        # would admit GET /v2/instances/{id}/user-data, whose base64 cloud-init
        # payload routinely embeds bootstrap credentials -- that is a secret
        # read, not an inventory read, and it stays spec-less.
        http:
          base_url: "https://api.vultr.com"
          methods: [GET]
          path_prefixes:
            - /v2/instances
            - /v2/plans
            - /v2/regions
            - /v2/os
            - /v2/account
          path_regex: '^/v2/(plans|regions|os|account|instances(/[0-9a-f-]+)?)/?$'
          auth: "bearer:VULTR_API_KEY"
      vultr.instance_create:
        label: "Create a VPS instance (spends money by the hour)"
        action_class: consequential
        http:
          base_url: "https://api.vultr.com"
          methods: [POST]
          path_prefixes:
            - /v2/instances
          path_regex: '^/v2/instances$'
          auth: "bearer:VULTR_API_KEY"
      vultr.instance_destroy:
        label: "Destroy a VPS instance (data is gone)"
        action_class: consequential
        http:
          base_url: "https://api.vultr.com"
          methods: [DELETE]
          path_prefixes:
            - /v2/instances/
          path_regex: '^/v2/instances/[0-9a-f-]+$'
          auth: "bearer:VULTR_API_KEY"

  ovh:
    label: "OVHcloud (Public Cloud compute)"
    group: infra
    # OVH does not use a bearer token; every request is SIGNED. The broker's
    # `ovh:` auth scheme reads the app key / app secret / consumer key and signs
    # method+url+body+timestamp per call, so only the app+consumer keys and a SHA1
    # digest go out -- the application secret never leaves the broker.
    #
    # `env` lists ONLY the three signing secrets. The Public-Cloud project id is
    # deliberately NOT here: `infra` is not in broker.INJECTABLE_GROUPS, so infra
    # env vars are never handed to an agent subprocess -- and the project id is a
    # URL-PATH component the CALLER must supply, not a signing secret. Declaring it
    # would be misleading (the agent still could not read it) and it is not a
    # secret anyway (a 32-char project identifier). The skill obtains it as an
    # operator-provided task parameter and passes it in the `path`.
    env: [OVH_APPLICATION_KEY, OVH_APPLICATION_SECRET, OVH_CONSUMER_KEY]
    capabilities:
      ovh.read:
        label: "List Public Cloud instances, flavors, images, and regions"
        action_class: read_only
        # GET-only project inventory. The full-match regex pins the four list
        # routes plus a single {id} detail segment and nothing deeper: OVH exposes
        # secret-bearing subresources under an instance (e.g. .../instance/{id}/
        # vnc, /rescueMode, credential-issuing calls) -- the same "secret read, not
        # an inventory read" risk vultr.read fences off from user-data. Those stay
        # spec-less: an extra path segment fails the fullmatch below.
        http:
          # EU/global control-plane endpoint. OVH also serves ca.api.ovh.com (CA)
          # and us.ovhcloud.com (US); eu.api.ovh.com is the EU/global v1 API used
          # by OVH_APPLICATION_NAME credentials minted on the EU endpoint.
          base_url: "https://eu.api.ovh.com"
          methods: [GET]
          path_prefixes:
            - /1.0/cloud/project/
          path_regex: '^/1\.0/cloud/project/[0-9a-fA-F]+/(instance|flavor|image|region)(/[0-9a-zA-Z-]+)?/?$'
          auth: "ovh:OVH_APPLICATION_KEY:OVH_APPLICATION_SECRET:OVH_CONSUMER_KEY"
      ovh.instance_create:
        label: "Create a Public Cloud instance (spends money by the hour)"
        # Highest defensible class: creating an instance provisions billable
        # compute, so it is consequential and hard-stops in auto mode (broker
        # money/danger hard-block + a store-validated human grant), exactly like
        # vultr.instance_create.
        action_class: consequential
        http:
          base_url: "https://eu.api.ovh.com"
          methods: [POST]
          path_prefixes:
            - /1.0/cloud/project/
          path_regex: '^/1\.0/cloud/project/[0-9a-fA-F]+/instance$'
          auth: "ovh:OVH_APPLICATION_KEY:OVH_APPLICATION_SECRET:OVH_CONSUMER_KEY"
      ovh.instance_delete:
        label: "Delete a Public Cloud instance (data is gone)"
        action_class: consequential
        http:
          base_url: "https://eu.api.ovh.com"
          methods: [DELETE]
          path_prefixes:
            - /1.0/cloud/project/
          path_regex: '^/1\.0/cloud/project/[0-9a-fA-F]+/instance/[0-9a-zA-Z-]+$'
          auth: "ovh:OVH_APPLICATION_KEY:OVH_APPLICATION_SECRET:OVH_CONSUMER_KEY"

  bunny:

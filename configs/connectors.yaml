  # credentials are never handed to an agent subprocess even though the group's
  # danger flag is a defensible-but-not-catastrophic true (a launched profile can
  # act as the logged-in account it belongs to, but does not itself move money or
  # destroy infrastructure the way the rest of this group can).
  dolphin_anty:

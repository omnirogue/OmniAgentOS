# Longhaul configuration (§7, LONGHAUL-DESIGN.md)

longhaul:
  # Default behavior: route "planned" coding tasks to longhaul instead of orchestrate
  default_for_planned_coding: true

  # Maximum executor attempts before escalating to blocked
  max_sessions: 8

  # Default cooldown duration (seconds) when reset time is unparsable
  default_cooldown_s: 3600

  # Per-session idle threshold (minutes) persisted onto every longhaul session
  # row at spawn; the A2 reaper honors it over its 15-minute global default.
  # Longhaul builds run long quiet stretches — keep this comfortably above them.
  idle_minutes: 45

  # Wall-clock timeout for Codex / non-Claude longhaul executors (milliseconds).
  # The config loader must accept this key; silent drop leaves no timeout (H-29).
  attempt_wall_ms: 1800000
  # On timeout, terminate the dedicated process group, then escalate and reap
  # within fixed bounds. No final communicate()/wait() is unbounded.
  attempt_term_grace_ms: 3000
  attempt_kill_reap_ms: 3000
  # Human-controlled exception list. Keep empty unless an operator explicitly
  # accepts an adapter's unattended launch risk (for example force-auto Kimi).
  unattended_elevated_harnesses: []

  # Fast-crash loop guard (L-13): consecutive attempts that die within
  # fast_crash_s of start get exponential dispatch backoff up to the cap.
  fast_crash_s: 30
  fast_crash_backoff_s: 5
  fast_crash_max_backoff_s: 300

  # Models to exclude from ranking (e.g., fable is reserved for lead tier)
  excluded_models:
    - fable

  # Fall back to cli-codex when no claude accounts are available
  cross_harness_fallback: true

  # Worker ranking weights (quality + speed - cost)
  weights:
    quality: 0.6
    speed: 0.25
    cost: 0.15

  # Static fallback worker order (when registry unavailable or stale)
  static_fallback_order:
    - harness: cli-gemini
      model: gemini-3.6-flash
    - harness: cli-gemini
      model: gemini-3.1-pro
    - harness: cli-gemini
      model: gemini-3.5-flash-lite
    - harness: cli-codex
      model: gpt-5.6-sol
    - harness: cli-claude
      model: sonnet
    - harness: cli-grok
      model: grok-4.5
    - harness: cli-kimi
      model: kimi-k3

  # Review gate configuration
  review:
    enabled: true
    harness: cli-codex
    deny_respawns: 2
    unavailable_retries: 3
    backoff_s: 30
    max_backoff_s: 900

  # Acceptance/prep phase configuration
  prep:
    model: sonnet
    wall_ms: 90000

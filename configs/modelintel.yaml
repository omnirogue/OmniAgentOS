# Model Intelligence — curated roster, capability domains, and priors.
#
# The daily update (omniagentos.modelintel.daily) merges LIVE benchmark data over
# these priors and writes the result to var/modelintel/registry.json plus the
# vault knowledge graph (vault/models/, vault/capabilities/, vault/benchmarks/
# sources/). Nothing here is a hard cap — priors are the starting belief that
# fresh benchmark evidence adjusts. Scores are 0..1.
#
# Editing rules:
# - `aliases` are matched after normalization (lowercase, parentheticals stripped,
#   spaces->dashes), so "GPT-5.6 Sol (high)" matches alias "gpt-5.6-sol".
# - `fusion_agents` maps a model to the agent ids Fusion can actually launch
#   (must match ids in ~/.claude/fusion/model-rankings.json). Empty list =
#   reference-only model (tracked for market awareness, never routed to).

router:
  model: grok-4.5
  reasoning_effort: low
  api_base: https://api.x.ai/v1
  timeout_seconds: 60

research:
  model: grok-4.5
  api_base: https://api.x.ai/v1
  timeout_seconds: 240

# Applied 2026-08-06 per operator ruling (session ledger,
# lane/autoroute-ruling-0806) — reflection proposal
# rfl_prop_20260804_router_derank_claude_subagent_workflows (status: shadow
# in var/runtime/state.sqlite3 reflection_proposals; NOT flipped to
# 'promoted' by this commit — see the note left for the coordinator).
# Self-reverting condition owned by the proposal, not enforced by this
# config: re-admit claude automatically once a launch-time sandbox-exemption
# assertion ships and one probe lane completes with zero policy_denial
# events.
routing_weights:
  formations:
    subagent_workflow:
      claude: >-
        down-rank for subagent_workflow formations pending a launch-time assertion that the sandbox-disable exemption is active (no nested Seatbelt); promote codex (implementer+reviewer) and grok (reviewer) into those slots; re-admit claude automatically once the assertion ships and one probe lane completes with zero policy_denial events
      scope_note: does NOT touch risk-pinned categories (external/deploy/destructive stay on Claude per pin)

domains:
  - key: coding-implementation
    title: Coding — implementation
    description: Well-scoped feature and fix implementation quality (edit correctness, code quality).
  - key: coding-architecture
    title: Coding — architecture
    description: Design-heavy, cross-cutting, high-risk engineering; system decomposition.
  - key: debugging
    title: Debugging
    description: Root-causing and repairing real defects in existing codebases.
  - key: agentic-tool-use
    title: Agentic tool use
    description: Long-horizon reliability driving tools, terminals, and multi-step plans.
  - key: long-context
    title: Long context
    description: Quality retained over very large inputs (big repos, long transcripts).
  - key: speed
    title: Speed
    description: Wall-clock latency to useful output (measured locally per lineage CLI).
  - key: web-research
    title: Web research
    description: Finding and synthesizing current information from the live web.

# How live benchmark scores blend into domain scores. Only percent-metric
# benchmarks blend numerically (elo-style boards rank but do not blend);
# blended = (1 - bench_weight_total/2) * prior + sum(weight/2 * bench_score).
#
# swebench-live and aa-coding-index are deterministic, independently-measured
# cross-checks on the Grok-research-sourced swe-bench-verified figure — weight
# has shifted from swe-bench-verified toward them (same total per domain as
# before: coding-implementation and debugging both still sum to 1.0) so a
# grounded live leaderboard/API carries at least as much weight as an LLM web
# sweep, without discarding the sweep entirely (it still covers models neither
# live source has data for yet).
domain_blend:
  coding-implementation:
    - benchmark: aider-polyglot
      weight: 0.6
    - benchmark: swe-bench-verified
      weight: 0.2
    - benchmark: swebench-live
      weight: 0.1
    - benchmark: aa-coding-index
      weight: 0.1
  debugging:
    - benchmark: swe-bench-verified
      weight: 0.7
    - benchmark: swebench-live
      weight: 0.3
  agentic-tool-use:
    - benchmark: terminal-bench
      weight: 1.0

benchmarks:
  - key: aider-polyglot
    title: Aider polyglot leaderboard
    metric: percent
    url: https://aider.chat/docs/leaderboards/
    fetch: aider
    description: 225 hard Exercism exercises across 6 languages; diff-edit correctness.
  - key: swe-bench-verified
    title: SWE-bench Verified
    metric: percent
    url: https://www.swebench.com/
    fetch: research
    description: Human-validated real GitHub issues resolved end-to-end.
  - key: swebench-live
    title: SWE-bench-Live (lite split)
    metric: percent
    url: https://swe-bench-live.github.io/
    fetch: swebench-live
    description: >-
      Continuously refreshed, real-submission GitHub-issue resolution rate;
      a deterministic cross-check/override on swe-bench-verified.
  - key: terminal-bench
    title: Terminal-Bench
    metric: percent
    url: https://www.tbench.ai/
    fetch: research
    description: Agentic tasks completed inside a real terminal.
  - key: lmarena-coding
    title: LMArena coding Elo
    metric: elo
    url: https://lmarena.ai/leaderboard
    fetch: research
    description: Human-preference Elo, coding category (ranking signal only).
  - key: openrouter-pricing
    title: OpenRouter pricing + context
    metric: facts
    url: https://openrouter.ai/api/v1/models
    fetch: openrouter
    description: Live per-token pricing and context windows, plus a per-model latency cross-check.
  - key: aa-coding-index
    title: Artificial Analysis coding index
    metric: percent
    url: https://artificialanalysis.ai/models
    fetch: aa-coding-index
    description: >-
      Independently-measured coding-quality index (0-100), plus tokens/sec,
      time-to-first-token, and $/Mtok pricing. Requires AA_API_KEY; skipped
      (not zeroed) when unset.


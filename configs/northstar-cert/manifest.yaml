# Canonical North Star result-binding catalog.  Every check carries its own
# explicit binding; the defaults anchor NEVER carries a binding (vacuous-
# binding class forbidden — tests/scripts/test_northstar_cert_manifest.py).
# Rebuilt 2026-08-09 from audit/S1..S6-merge.md + COVERAGE-CLOSURE.md;
# resolution log in devtasks/northstar-cert/AMENDMENT-REQUESTS.md.
# Every colon-shaped requirement is backed by the sticky reverse-index in
# writers.yaml; deleting a manifest token alone does not remove its check-id
# gate or grant PASS. writer: evidence is AST-probed, launchd: is live-probed,
# and other prefixes use their existing explicit availability/filesystem paths.
#
# `version` is the SUITE version (evs_northstar_cert_v<N> in the eval store,
# recorder: _ensure_suite). Any change to this file's CONTENT changes the
# manifest digest, and the recorder refuses mixed evidence against a suite row
# whose dataset_hash no longer matches — so every content change MUST bump this
# number or all subsequent runs render VOID (measured 2026-08-11: 000000000
# changed content at implicit v1 and both tiers VOIDed estate-wide).

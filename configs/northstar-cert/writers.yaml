# Sticky reverse-index for every colon-shaped North Star mask token.
#
# STRUCTURAL LOWER BOUND — NOT A FULL SEMANTIC GUARANTEE: a writer proof shows
# that its test references the witness non-vacuously, but cannot prove that the
# assertion adequately establishes the capability or that the witness was newly
# landed by the reviewed change rather than pre-existing. Cross-lineage review
# backstops this residual: manifest.yaml and writers.yaml must remain in
# pipeline/bridge/review_policy.py::_RISKY_EXACT — as must the instrument that
# reads them (scripts/northstar_cert/record_results.py, emit_gaps.py,
# migrate_writers_v3.py). This is honestly a structural lower-bound + review
# model, not a pure static guarantee.
#
# NAMED RESIDUALS of the static "does this proof exercise its witness" check:
#   * REACHABILITY. Only constant-false shapes are pruned (`if False:`, `if 0:`,
#     the `else` of `if True:`). A witness call behind ANY runtime condition —
#     `if os.environ.get("X"):`, an early return, a mocked-out branch — still
#     reads as exercised. Reachability is undecidable in general and this module
#     does not pretend otherwise.
#   * ADEQUACY. `assert witness.attr is not None` exercises the witness and
#     establishes almost nothing about the capability.
#   * NEWNESS. Nothing here distinguishes a capability this change landed from
#     one that predates it.
#   * ALIASING / RE-EXPORTS. The realness guard's import resolution is textual
#     (AST imports): a witness re-exported through a package `__init__` and
#     consumed under an alias can read as unreferenced, and a same-named symbol
#     defined elsewhere could launder a reference. No current pair hits this.
# Each landed PAIR is therefore a Class-A cross-lineage review surface, and that
# review — not this file's static checks — is what closes these four.
#
# Every token/check pair in manifest history stays here forever. A null witness
# means the capability is not landed; a landed writer needs path.py::Symbol plus
# a distinct @pytest.mark.nsc_writer_proof("writer:...") proof nodeid.
#
# SCHEMA v3 — per-(token, check) satisfiability for NON-writer tokens.
# `writer:` entries keep token-wide evidence (`gates` list + witness/proof):
# their capability lands once for every check the token gates. Every other
# token (glue:, binding:, launchd:, fs:, provider:, suite:, campaign:, ...)
# carries a per-check map instead:
#
#   "glue:fold-legs-pending":
#     gates:
#       NSC-C02-02: {witness: omniagentos/x.py::symbol, proof: tests/y.py::test_z}
#       NSC-C02-06: {witness: null, proof: null}
#
# because one glue token masks a hundred unrelated checks and one landed leg
# discharges exactly the check it was built for. `witness: null, proof: null`
# is NOT-LANDED — identical in meaning to the bare list this replaced, so the
# migration (scripts/northstar_cert/migrate_writers_v3.py) changed no verdict.
#
# A per-pair proof self-declares its PAIR, not the bare token:
# @pytest.mark.nsc_writer_proof("glue:fold-legs-pending@NSC-C02-02"). A proof
# declaring only the token would read as evidence for all hundred checks.
# Landed pairs are held to the same mechanical discipline writer evidence gets
# (witness resolves, proof declares the pair, proof exercises the witness,
# proof is never the gated carrier, proof EXECUTED AND PASSED in this run), so
# deleting or breaking a leg reverts that pair to unsatisfied — no ratchet.
# NSCERT_AVAILABLE_REQUIREMENTS arming is unchanged and remains an OR: it can
# still satisfy a whole token, and a landed pair can only ever add.
